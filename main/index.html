<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Data-analysis review</title>
</head>
<body>
<style>
  :root{
    --paper:#f6f4f0; --surface:#ffffff; --sunk:#f0eee9;
    --ink:#14181e; --ink-2:#3d4652; --muted:#6b7480; --line:#e2ddd5; --line-2:#cfc8bd;
    --accent:#0d6a62; --accent-ink:#ffffff; --accent-tint:#e2efec; --accent-2:#0a5049;
    --warn:#8a5a12; --maxw:680px;
    --serif:ui-serif,"Iowan Old Style","Charter","Palatino Linotype",Georgia,serif;
    --sans:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  }
  @media (prefers-color-scheme:dark){:root{
    --paper:#0f1317; --surface:#171d22; --sunk:#1e252b; --ink:#eaeef1; --ink-2:#c2cad3;
    --muted:#939daa; --line:#2a333b; --line-2:#3c4752; --accent:#4fb3a6;
    --accent-ink:#08120f; --accent-tint:#152a28; --accent-2:#6cc9bc; --warn:#d9ad5e;
  }}
  :root[data-theme="dark"]{
    --paper:#0f1317; --surface:#171d22; --sunk:#1e252b; --ink:#eaeef1; --ink-2:#c2cad3;
    --muted:#939daa; --line:#2a333b; --line-2:#3c4752; --accent:#4fb3a6;
    --accent-ink:#08120f; --accent-tint:#152a28; --accent-2:#6cc9bc; --warn:#d9ad5e;
  }
  :root[data-theme="light"]{
    --paper:#f6f4f0; --surface:#ffffff; --sunk:#f0eee9; --ink:#14181e; --ink-2:#3d4652;
    --muted:#6b7480; --line:#e2ddd5; --line-2:#cfc8bd; --accent:#0d6a62;
    --accent-ink:#ffffff; --accent-tint:#e2efec; --accent-2:#0a5049; --warn:#8a5a12;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
    font-size:18px;line-height:1.62;-webkit-font-smoothing:antialiased}
  .top{position:fixed;top:0;left:0;right:0;background:var(--paper);z-index:20;border-bottom:1px solid var(--line)}
  .top-in{max-width:var(--maxw);margin:0 auto;padding:13px 24px;display:flex;
    justify-content:space-between;align-items:baseline;gap:16px}
  .brand{font-family:var(--mono);font-size:12px;letter-spacing:.13em;text-transform:uppercase;
    color:var(--muted);font-weight:600}
  .ticker{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--muted)}
  .bar{height:2px;background:var(--line)}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .35s cubic-bezier(.4,0,.2,1)}
  @media (prefers-reduced-motion:reduce){.bar>i{transition:none}}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:96px 24px 72px}
  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.13em;text-transform:uppercase;
    color:var(--accent);font-weight:600;margin:0 0 18px}
  h1{font-family:var(--serif);font-size:36px;line-height:1.14;font-weight:600;margin:0 0 18px;
    letter-spacing:-.014em;text-wrap:balance}
  p{margin:0 0 17px;color:var(--ink-2)}
  p strong{color:var(--ink)}
  .lead{font-size:17px;color:var(--muted)}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:4px;
    padding:26px 28px;margin:0 0 32px;box-shadow:0 1px 2px rgba(20,24,30,.04)}
  .panel section + section{border-top:1px solid var(--line);margin-top:20px;padding-top:20px}
  .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.15em;text-transform:uppercase;
    color:var(--muted);font-weight:600;margin:0 0 9px}
  .txt{margin:0;font-size:18.5px;line-height:1.55;color:var(--ink)}
  .txt.q-serif{font-family:var(--serif);font-size:22px;line-height:1.36;letter-spacing:-.006em}
  .stat{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:15.5px;line-height:1.55;
    background:var(--sunk);border-radius:3px;padding:13px 15px;color:var(--ink);white-space:pre-wrap}
  .cells{list-style:none;padding:0;margin:0}
  .cells li{padding:12px 0;border-top:1px dotted var(--line-2);display:flex;gap:14px;
    font-size:17.5px;line-height:1.5;color:var(--ink)}
  .cells li:first-child{border-top:0;padding-top:0}
  .cells .k{font-family:var(--mono);font-size:14px;color:var(--accent);font-weight:700;padding-top:3px}
  .q{font-family:var(--serif);font-size:20.5px;font-weight:600;line-height:1.36;
    margin:0 0 14px;letter-spacing:-.006em;text-wrap:balance}
  .grp{margin:0 0 32px}
  .opts{display:flex;flex-direction:column;gap:9px}
  .opt{display:flex;align-items:flex-start;gap:14px;border:1px solid var(--line);border-radius:4px;
    padding:14px 17px;cursor:pointer;background:var(--surface);font-size:17.5px;line-height:1.45;
    color:var(--ink);transition:border-color .13s,background .13s}
  .opt:hover{border-color:var(--line-2);background:var(--sunk)}
  .opt.sel{border-color:var(--accent);background:var(--accent-tint);box-shadow:inset 0 0 0 1px var(--accent)}
  .opt input{margin:2px 0 0;accent-color:var(--accent);width:18px;height:18px;flex:0 0 auto}
  .opt .kk{font-family:var(--mono);font-size:14px;color:var(--accent);font-weight:700;flex:0 0 auto}
  .followup{margin-top:11px;display:none}
  .followup.on{display:block}
  .followup input{width:100%;font:inherit;font-size:16.5px;padding:12px 14px;border-radius:4px;
    border:1px solid var(--line-2);background:var(--surface);color:var(--ink)}
  .foot{display:flex;justify-content:flex-end;margin-top:34px;border-top:1px solid var(--line);padding-top:22px}
  button.go{font:inherit;font-size:17px;font-weight:600;background:var(--accent);color:var(--accent-ink);
    border:0;border-radius:4px;padding:14px 34px;cursor:pointer;transition:background .13s}
  button.go:hover:not(:disabled){background:var(--accent-2)}
  button.go:disabled{opacity:.38;cursor:not-allowed}
  button.ghost{font:inherit;font-size:16.5px;background:none;border:1px solid var(--line-2);
    color:var(--ink);border-radius:4px;padding:14px 24px;cursor:pointer}
  .warnmsg{color:var(--warn);font-size:14.5px;margin:12px 0 0;min-height:20px;text-align:right}
  .dl{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
  code{font-family:var(--mono);font-size:.88em;background:var(--sunk);padding:2px 6px;border-radius:3px}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media (max-width:520px){.wrap{padding:92px 18px 56px} h1{font-size:29px}
    .panel{padding:20px 18px} .txt.q-serif{font-size:20px} .q{font-size:19px}}
</style>

<header class="top">
  <div class="top-in"><span class="brand">Data-analysis review</span>
  <span class="ticker" id="ticker"></span></div>
  <div class="bar"><i id="prog"></i></div>
</header>
<div class="wrap"><div id="app"></div></div>

<script>
window.SURVEY = {"title": "Contrastive Discovery — Human Study (pilot)", "screener": [{"text": "A study reports p = 0.03. Which statement is correct?", "choices": ["There is a 3% chance that the null hypothesis is true here", "There is a 3% chance this result was produced by chance", "Results this extreme occur 3% of the time when the null is true", "The effect is large enough to be practically important"], "correct": 2}, {"text": "Proposed answers to “How does X relate to Y?” — (A) X and Y are positively correlated. (B) X and Y are correlated. (C) X and Y are uncorrelated. Can any two of these be true at the same time?", "choices": ["No — they are mutually exclusive", "Yes — (A) and (B)", "Yes — (B) and (C)", "Yes — (A) and (C)"], "correct": 1}, {"text": "A researcher tests 40 independent hypotheses, each at the 5% significance level, and finds 2 significant results. Which statement is correct?", "choices": ["This is about how many significant results chance alone would give", "The two significant results are unlikely to have arisen by chance", "The study lacks the statistical power to detect any real effect", "Testing more hypotheses lowers the chance of a false positive"], "correct": 0}], "trials": [{"card_id": "T01", "domain_label": "Materials science", "dataset_desc": "68,805 inorganic crystalline compounds with computed physical properties.", "question": "Which is more strongly associated with a material being stable, bulk_modulus_vrh or shear_modulus_vrh?", "cells": ["Stability is more strongly associated with bulk_modulus_vrh than with shear_modulus_vrh.", "Stability is more strongly associated with shear_modulus_vrh than with bulk_modulus_vrh.", "Neither bulk_modulus_vrh nor shear_modulus_vrh is meaningfully associated with stability."], "evidence": "Regression predicting stability from standardized bulk and shear modulus -- standardized coefficients: bulk_modulus_vrh 0.010819, shear_modulus_vrh 0.014001. The excerpt reports no standard errors, p-values, 95% CI, or n.", "variables": "is_stable = \"True if the material lies exactly on the convex hull (ground state at its composition)\"; bulk_modulus_vrh = \"Voigt-Reuss-Hill average bulk modulus K in GPa\"; and shear_modulus_vrh = \"Voigt-Reuss-Hill average shear modulus G in GPa\" -- both moduli are NaN for ~86% of the 68,805 materials because elasticity was not computed for them (9,644 rows have values)."}, {"card_id": "T02", "domain_label": "Astronomy", "dataset_desc": "50,000 SDSS galaxies with photometric and spectroscopic measurements.", "question": "Does a galaxy's spectroscopic sub-class change the relationship between modelMag_z and redshift?", "cells": ["The relationship between modelMag_z and redshift is mediated by the 'AGN' sub-class.", "The relationship between modelMag_z and redshift is mediated by the 'STARFORMING' sub-class.", "Galaxy sub-class does not mediate the relationship between modelMag_z and redshift."], "evidence": "OLS regression predicting redshift from modelMag_z plus sub-class terms -- modelMag_z coef = 9.008e-07, std err = 3.9e-06, t = 0.231, P>|t| = 0.817; model R-squared = 0.020, F-statistic = 191.8, Prob (F-statistic) = 3.53e-83, No. Observations = 18934. The 95% CI column is cut off in the excerpt (\"-6.\" only).", "variables": "redshift = \"Spectroscopic redshift z measured from galaxy emission/absorption lines (range restricted to 0.02-0.3 in this sample)\"; modelMag_z = \"Model magnitude in the z band (IR, ~905 nm); -9999 is a SDSS 'no-data' sentinel\"; subClass = \"Finer spectroscopic sub-classification (e.g. STARFORMING, STARBURST, AGN, BROADLINE, AGN BROADLINE); NaN when the pipeline could not assign a sub-class\" (NaN for ~62% of rows)."}, {"card_id": "T03", "domain_label": "Finance / lending", "dataset_desc": "2,380 U.S. mortgage applications with applicant and loan attributes.", "question": "Is bad_history associated with a higher, lower, or unchanged probability that a mortgage application is denied?", "cells": ["Higher bad_history is associated with higher probability of deny (positive effect).", "bad_history is not associated with deny (no effect).", "Higher bad_history is associated with lower probability of deny (negative effect)."], "evidence": "Logistic regression predicting deny from bad_history -- coefficient = 1.298833784197439, standard error = 0.19091263463493507, 95% confidence interval [0.924652, 1.673016]. n is not printed in the excerpt; the dataset has 2,380 rows.", "variables": "bad_history = \"1 if applicant has history of bad credit, 0 otherwise\"; deny = \"1 if mortgage application was denied, 0 if accepted\"; dataset has 2,380 mortgage applications."}, {"card_id": "T04", "domain_label": "Software engineering", "dataset_desc": "276 survey respondents on requirements-engineering practices.", "question": "Does the degree to which ML aspects are addressed vary across the different professional roles?", "cells": ["The degree to which ML aspects are addressed varies significantly across roles.", "The degree to which ML aspects are addressed does not vary significantly across roles."], "evidence": "Levene's test for equality of variances in ML-addressing scores across roles -- test statistic = 150.7723978611592, p-value = 1.1916200446813687e-169. No CI or n reported in the excerpt; the survey has 276 respondents.", "variables": "The Q8_ML_Addressing_* fields, one per role, each documented as \"Degree to which ML aspects are addressed by the [Project Lead / Business Analyst / Requirement Engineer / Solution Architect / Data Scientist / Developer / Tester] in the respondent's organization\"; each is recorded as the string 'quoted' or 'not quoted', with '-77' as a missing-value code. Survey of 276 respondents."}, {"card_id": "T05", "domain_label": "Materials science", "dataset_desc": "68,805 inorganic crystalline compounds with computed physical properties.", "question": "Does formation_energy_per_atom differ across magnetic ordering types, and which ordering type has the higher values?", "cells": ["Higher formation_energy_per_atom is associated with ferromagnetic (FM) ordering.", "formation_energy_per_atom is not associated with magnetic ordering type.", "Higher formation_energy_per_atom is associated with non-magnetic (NM) ordering."], "evidence": "One-way ANOVA of formation_energy_per_atom across ordering groups -- F-statistic = 984.4336064981522, p-value = 0.0. Group means visible in the excerpt: FiM -0.991237, NM -1.374536, Unknown -1.872426, plus one further group whose label is cut off with mean 1.812672. No CI or n reported.", "variables": "formation_energy_per_atom = \"DFT-computed formation energy per atom in eV/atom (negative values indicate thermodynamically favorable compound relative to elemental references)\"; ordering = \"Magnetic ordering: 'NM' (non-magnetic), 'FM' (ferromagnetic), 'AFM' (antiferromagnetic), 'FiM' (ferrimagnetic), or 'Unknown'\". 68,805 materials."}, {"card_id": "T06", "domain_label": "Astronomy", "dataset_desc": "50,000 SDSS galaxies with photometric and spectroscopic measurements.", "question": "Is petroR90_r correlated with petroR50_r, and in which direction?", "cells": ["petroR90_r is positively correlated with petroR50_r.", "petroR90_r is negatively correlated with petroR50_r.", "petroR90_r is not correlated with petroR50_r."], "evidence": "Pearson correlation between petroR90_r and petroR50_r -- correlation coefficient = 1.000, 95% confidence interval [1.000, 1.000]. n is not printed in the excerpt (dataset has 50,000 galaxies).", "variables": "petroR90_r = \"Radius in the r band enclosing 90% of the Petrosian flux (arcsec); petroR90_r / petroR50_r is a standard concentration index / morphological proxy\"; petroR50_r = \"Radius in the r band enclosing 50% of the Petrosian flux (arcsec; half-light radius); -9999 is a 'no-data' sentinel\". 50,000 galaxies."}, {"card_id": "T07", "domain_label": "Finance / lending", "dataset_desc": "2,380 U.S. mortgage applications with applicant and loan attributes.", "question": "Does the mortgage acceptance rate differ between self-employed and non-self-employed applicants?", "cells": ["The acceptance rate is higher among self-employed applicants.", "The acceptance rate does not differ between self-employed and non-self-employed applicants.", "The acceptance rate is higher among non-self-employed applicants."], "evidence": "Chi-square test of accept by self_employed -- acceptance rate for self-employed applicants = 0.8339350180505415, acceptance rate for non-self-employed applicants = 0.8863528292914884, Chi-square test statistic = 5.892468312031054, p-value = 0.015205772786652996. No CI reported; n not printed in the excerpt (dataset has 2,380 rows).", "variables": "self_employed = \"1 if applicant is self-employed, 0 otherwise\"; accept = \"1 if mortgage application was accepted, 0 if denied\"; 2,380 mortgage applications."}, {"card_id": "T08", "domain_label": "Materials science", "dataset_desc": "68,805 inorganic crystalline compounds with computed physical properties.", "question": "Is universal_anisotropy correlated with density, and in which direction?", "cells": ["Higher universal_anisotropy is associated with lower density.", "universal_anisotropy is not significantly correlated with density.", "Higher universal_anisotropy is associated with higher density."], "evidence": "Pearson correlation between universal_anisotropy and density -- Pearson Correlation Coefficient = 0.009952737813717943, P-value = 0.3284231886610459. No CI reported; n not printed in the excerpt (elasticity values exist for 9,644 materials).", "variables": "universal_anisotropy = \"Universal elastic anisotropy index A^U (Ranganathan & Ostoja-Starzewski 2008); 0 for elastically isotropic, larger = more anisotropic. NaN for ~86% of materials where elasticity wasn't computed\"; density = \"Mass density in g/cm^3\". Values exist for 9,644 of 68,805 materials."}, {"card_id": "T09", "domain_label": "Astronomy", "dataset_desc": "50,000 SDSS galaxies with photometric and spectroscopic measurements.", "question": "Does signal_to_noise_r vary with right ascension (ra), and if so at which end of the ra range is it higher?", "cells": ["Higher signal_to_noise_r values are concentrated among galaxies with low values of ra.", "Higher signal_to_noise_r values are concentrated among galaxies with high values of ra.", "signal_to_noise_r is not associated with ra."], "evidence": "One-way ANOVA of signal_to_noise_r across ra segments -- mean signal_to_noise_r by segment: Low 17.246068, Medium 18.416152, High 17.554405; ANOVA F-statistic = 79.7040, p-value = 2.7545e-35; Pearson correlation between ra and signal_to_noise_r = 0.00006. No CI reported; n not printed in the excerpt (dataset has 50,000 galaxies).", "variables": "signal_to_noise_r = \"Median spectral signal-to-noise ratio in the r-band (s.snMedian_r)\"; ra = \"Right ascension in J2000 decimal degrees (sky longitude, 0-360)\", here split into Low / Medium / High segments. 50,000 galaxies."}, {"card_id": "T10", "domain_label": "Finance / lending", "dataset_desc": "2,380 U.S. mortgage applications with applicant and loan attributes.", "question": "Does the association between consumer_credit and mortgage denial differ between self-employed and non-self-employed applicants?", "cells": ["The association between consumer_credit and deny is the same for self-employed and non-self-employed applicants.", "The association between consumer_credit and deny is larger for self-employed applicants than for non-self-employed applicants.", "The association between consumer_credit and deny is larger for non-self-employed applicants than for self-employed applicants.", "consumer_credit is not associated with deny in either group."], "evidence": "Logistic regression predicting deny from consumer_credit, self_employed and their interaction -- consumer_credit coef = 0.4023, std err 0.035, z = 11.483, P>|z| = 0.000, 95% CI [0.334, 0.471]; self_employed coef = 0.6933, std err 0.318, z = 2.178, P>|z| = 0.029, 95% CI [0.069, 1.317]; credit_self_employed_interaction coef = -0.0587, std err 0.099, z = -0.594, P>|z| = 0.553, 95% CI [-0.252, 0.135]; Pseudo R-squ. = 0.08405, LLR p-value = 1.425e-31. n not printed in the excerpt (dataset has 2,380 rows).", "variables": "consumer_credit = \"Applicant's consumer credit score\", an ordinal taking integer values 1-6; the dataset documentation does not state which end of this scale corresponds to better or worse credit. self_employed = \"1 if applicant is self-employed, 0 otherwise\"; deny = \"1 if mortgage application was denied, 0 if accepted\". 2,380 mortgage applications."}, {"card_id": "T11", "domain_label": "Online discourse", "dataset_desc": "7,975 contributions to online debate threads.", "question": "Does WPS (words per sentence) differ between threads with academic contributors and threads with non-academic contributors?", "cells": ["WPS is higher in academic-contributor threads than in non-academic threads.", "WPS is higher in non-academic-contributor threads than in academic threads.", "WPS does not differ between academic and non-academic threads."], "evidence": "Two-sample t-test of WPS by academic status -- Average WPS in academic threads = 19.0421282932417, Average WPS in non-academic threads = 17.859096870342775, T-statistic = 5.768641515603874, P-value = 8.29992750432492e-09. No CI or per-group n reported in the excerpt.", "variables": "WPS = words per sentence, a LIWC-derived text measure, range 1.0-113.0; Academic = a binary variable taking values 0 or 1 flagging the contributor's academic status (the dataset codebook supplies no text description of which value is which; the analysis treats it as academic vs non-academic). 7,975 contributions across 522 threads."}, {"card_id": "T12", "domain_label": "Materials science", "dataset_desc": "68,805 inorganic crystalline compounds with computed physical properties.", "question": "Which accounts for more of the variability in density, point_group or nelements?", "cells": ["Point group symmetry is the dominant source of variability in density.", "The number of distinct elements reduces variability in density relative to point group symmetry.", "Neither point group symmetry nor the number of distinct elements accounts for a significant share of the variability in density."], "evidence": "Separate one-way ANOVAs of density by group -- Point Group Influence on Density Variance: F-statistic = 507.56704277290993, p-value = 0.0; Number of Elements Influence on Density Variance: F-statistic = 4946.438041692631, p-value = 0.0. The excerpt also shows mean density by element count (3 = 7.775106, 4 = 2.938562; the first entry is truncated to \"664561\"). No CI or n reported.", "variables": "density = \"Mass density in g/cm^3\"; point_group = \"Crystallographic point group in Hermann-Mauguin notation (32 possible)\"; nelements = \"Number of distinct chemical elements in the compound (2, 3, or 4 in this sample)\". 68,805 materials."}, {"card_id": "T13", "domain_label": "Labor economics / sociology", "dataset_desc": "12,686 respondents from a U.S. longitudinal survey (NLSY79).", "question": "Does the 1996 market value of vehicles owned differ across racial/ethnic cohorts, and in which direction?", "cells": ["Racial/ethnic cohort is associated with the 1996 market value of vehicles in a positive direction.", "Racial/ethnic cohort is not associated with the 1996 market value of vehicles.", "Racial/ethnic cohort is associated with the 1996 market value of vehicles in a negative direction."], "evidence": "One-way ANOVA of 1996 vehicle market value across the three racial/ethnic cohorts: F-value 80.88124747773098, p-value 1.9236316256019844e-35; Tukey HSD mean differences - group 1 vs 2 = -861.1065 (p-adj 0.1151, [-1876.2578, 154.0448], reject False), 1 vs 3 = 3102.5812 (p-adj 0.0, [2230.7602, 3974.4023], reject True), 2 vs 3 = 3963.6878 (p-adj 0.0, [3155.9331, 4771.4424], reject True); n not reported in the excerpt.", "variables": "\"Market Value of vehicles respondent/spouse own, 96\" = \"Total market value of all vehicles including automobiles that respondent/spouse owned in 1996\" (US dollars); \"Racial/ethnic cohort, 1979\" = \"Respondent's racial/ethnic cohort, contains one of three values 1:BLACK, 2:HISPANIC, 3:NON-BLACK NON-HISPANIC\" (a nominal 3-level code, so \"positive\" or \"negative\" direction is only defined if the code is treated as a numeric scale)."}, {"card_id": "T14", "domain_label": "Astronomy", "dataset_desc": "50,000 SDSS galaxies with photometric and spectroscopic measurements.", "question": "Does signal_to_noise_r differ across redshift classes?", "cells": ["signal_to_noise_r varies across redshift classes.", "signal_to_noise_r does not vary across redshift classes."], "evidence": "One-way ANOVA of signal_to_noise_r across redshift classes: Statistic 5024.4534163598055, P-value 0.0; no CI and no n reported in the excerpt (dataset n = 50,000).", "variables": "signal_to_noise_r = \"Median spectral signal-to-noise ratio in the r-band (s.snMedian_r)\"; redshift classes are discrete bins constructed by the analysis from redshift = \"Spectroscopic redshift z measured from galaxy emission/absorption lines (range restricted to 0.02-0.3 in this sample)\" - the binned class variable is not itself a documented column; sample = 50,000 galaxies."}, {"card_id": "T15", "domain_label": "Software engineering", "dataset_desc": "276 survey respondents on requirements-engineering practices.", "question": "Does the number of deployed ML projects differ between respondents who used the CRISP-DM framework and those who did not?", "cells": ["Deployment success (D8_ML_Production) is higher for respondents using the CRISP-DM framework.", "Deployment success (D8_ML_Production) is higher for respondents not using the CRISP-DM framework.", "Deployment success (D8_ML_Production) does not differ by CRISP-DM use."], "evidence": "Two-sample t-test comparing mean deployment success between CRISP-DM and non-CRISP-DM respondents: mean for CRISP-DM projects 5.341463414634147, mean for non-CRISP-DM projects 3.3058252427184467, t-statistic 1.8309927901764091, p-value 0.06831609859793038; no CI and no n reported in the excerpt.", "variables": "D8_ML_Production = \"Number of ML-enabled system projects that the respondent participated in that actually got deployed\" (count; -99 denotes missing) used as the deployment-success measure; D10_ML_Management_Framework_CRISP-DM = \"Participant responded with CRISP-DM as the response for project management framework applied in the participated ML-enabled systems project\", coded \"quoted\" (41 respondents) versus \"not quoted\" (235 respondents) out of 276 survey respondents."}, {"card_id": "T16", "domain_label": "Materials science", "dataset_desc": "68,805 inorganic crystalline compounds with computed physical properties.", "question": "Which is more strongly associated with formation_energy_per_atom - density or volume?", "cells": ["Density is more strongly associated with formation_energy_per_atom than volume.", "Volume is more strongly associated with formation_energy_per_atom than density.", "Density and volume are associated with formation_energy_per_atom to an equal degree.", "Neither density nor volume is associated with formation_energy_per_atom."], "evidence": "Regression of formation_energy_per_atom on standardized density and volume: Standardized Coefficients - Density 0.4276, Volume -0.0087; Partial R^2 Values - Density 0.1487, Volume 0.0001; no p-values, CI, or n reported in the excerpt.", "variables": "formation_energy_per_atom = \"DFT-computed formation energy per atom in eV/atom (negative values indicate thermodynamically favorable compound relative to elemental references)\"; density = \"Mass density in g/cm^3\"; volume = \"Volume of the primitive unit cell in cubic Angstroms\"; sample = 68,805 inorganic materials."}, {"card_id": "T17", "domain_label": "Labor economics / sociology", "dataset_desc": "12,686 respondents from a U.S. longitudinal survey (NLSY79).", "question": "Does respondent weight change between 1981 and 1992, and in which direction?", "cells": ["Weight increases from 1981 to 1992.", "Weight stays the same from 1981 to 1992.", "Weight decreases from 1981 to 1992."], "evidence": "One-way ANOVA of respondent weight across measurement years: ANOVA F-statistic 835.246348372377, p-value 0.0; no CI and no n reported in the excerpt.", "variables": "\"Weight of respondent, 1981\", \"Weight of respondent, 1989\" and \"Weight of respondent, 1992\" = \"Weight of the respondent in kilograms\" in each of those interview years."}, {"card_id": "T18", "domain_label": "Astronomy", "dataset_desc": "50,000 SDSS galaxies with photometric and spectroscopic measurements.", "question": "Do velDisp outliers occur at different rates in STARFORMING versus AGN subclass galaxies?", "cells": ["velDisp outliers occur at a higher rate in star-forming galaxies.", "velDisp outliers occur at a higher rate in AGN-host galaxies.", "velDisp outliers occur at the same rate across subclasses."], "evidence": "Chi-squared test of velDisp outlier rate by subclass: Outlier rates (Starforming, AGN) 0.011361088272666119 and 0.03225806451612903; Chi-squared test result p-value = 0.0; the chi-squared statistic, CI, and per-group n are not reported in the excerpt.", "variables": "velDisp = \"Stellar velocity dispersion in km/s measured from the galaxy spectrum; 0 indicates a failed fit\", with the outlier threshold set by the analysis rather than by the codebook; subClass = \"Finer spectroscopic sub-classification (e.g. STARFORMING, STARBURST, AGN, BROADLINE, AGN BROADLINE); NaN when the pipeline could not assign a sub-class\"; sample = 50,000 galaxies."}, {"card_id": "T19", "domain_label": "Materials science", "dataset_desc": "68,805 inorganic crystalline compounds with computed physical properties.", "question": "Do materials with low bulk_modulus_vrh differ in chemical composition from materials with high bulk_modulus_vrh?", "cells": ["Materials with low bulk_modulus_vrh have different chemical compositions from materials with high bulk_modulus_vrh.", "Chemical compositions are the same regardless of bulk_modulus_vrh value.", "There is no consistent compositional pattern associated with bulk_modulus_vrh."], "evidence": "Chi-square test of composition-cluster membership against the low/high bulk_modulus_vrh split, plus a permutation test: Chi-square test results Power_divergenceResult(statistic=np.float64(1799.6221484861053), pvalue=np.float64(0.0)); Permutation test p-value 0.619; no CI and no n reported in the excerpt.", "variables": "bulk_modulus_vrh = \"Voigt-Reuss-Hill average bulk modulus K in GPa (the recommended scalar estimate). NaN when elasticity not computed\" (elasticity is missing for about 86% of the 68,805 materials), split by the analysis into low and high groups; chemical composition is taken from formula_pretty = \"Chemical formula in reduced form (e.g. 'Fe2O3', 'SiC')\" together with nelements = \"Number of distinct chemical elements in the compound (2, 3, or 4 in this sample)\", reduced by PCA and clustering."}, {"card_id": "T20", "domain_label": "Online discourse", "dataset_desc": "7,975 contributions to online debate threads.", "question": "Does Workplace_SR predict Total_Citations, and with which sign?", "cells": ["Higher values of Workplace_SR predict higher Total_Citations (positive coefficient).", "Higher values of Workplace_SR predict lower Total_Citations (negative coefficient).", "Workplace_SR does not predict Total_Citations."], "evidence": "OLS regression predicting Total_Citations with 2 predictors including Workplace_SR: R-squared 0.442, Adj. R-squared 0.441, F-statistic 488.8, Prob (F-statistic) 4.89e-157, No. Observations 1236; const 1.968e+04, t 22.843, P>|t| 0.000, 95% CI [1.8e+04, 2.14e+04]; Workplace_SR coefficient 57.4404 - the excerpt is truncated at that value, so its standard error, p-value and CI are not shown.", "variables": "Total_Citations - total citation count recorded for a contributor (range 80 to 143,833); Workplace_SR - the Shanghai Ranking position of the contributor's workplace, recorded as a numeric string with 113 distinct values (the codebook does not state whether a lower or a higher rank number corresponds to a more prestigious institution, so the sign of the coefficient cannot be translated into a prestige direction from the documentation)."}, {"card_id": "T21", "domain_label": "Finance / lending", "dataset_desc": "2,380 U.S. mortgage applications with applicant and loan attributes.", "question": "Does the association between PI_ratio and loan acceptance differ between female and male applicants?", "cells": ["Higher PI_ratio is associated with higher loan acceptance among male applicants.", "Higher PI_ratio is associated with higher loan acceptance among female applicants.", "PI_ratio is not associated with loan acceptance in either gender group."], "evidence": "Logistic regression predicting acceptance from PI_ratio, female and their interaction: PI_ratio coef -6.7927, std err 0.895, z -7.586, P>|z| 0.000, 95% CI [-8.548, -5.038]; female coef -0.5344, std err 0.636, z -0.841, P>|z| 0.401, 95% CI [-1.780, 0.712]; PI_ratio:female coef 1.5532, std err 1.723, z 0.902, P>|z| 0.367, 95% CI [-1.823, 4.930]; Intercept 4.3466, 95% CI [3.705, 4.989]; pseudo R-squ. 0.04405, LLR p-value 3.063e-16; n not reported in the excerpt (dataset n = 2,380).", "variables": "accept = \"1 if mortgage application was accepted, 0 if denied\"; PI_ratio = \"Total debt payments to income ratio\" (0.0-0.95); female = \"1 if applicant is female, 0 if male\"; full dataset n = 2,380 applications."}, {"card_id": "T22", "domain_label": "Astronomy", "dataset_desc": "50,000 SDSS galaxies with photometric and spectroscopic measurements.", "question": "Does signal_to_noise_r predict velDisp?", "cells": ["signal_to_noise_r predicts velDisp.", "signal_to_noise_r does not predict velDisp."], "evidence": "OLS regression predicting velDisp from signal_to_noise_r: R-squared 0.002, Adj. R-squared 0.002, F-statistic 121.6, Prob (F-statistic) 2.99e-28, No. Observations 50000, Df Model 1; const 138.8170, std err 0.987, t 140.598, P>|t| 0.000, 95% CI [136.882, 140.752]; the signal_to_noise_r row is truncated in the excerpt at \"0.\", so its coefficient value and CI are not shown.", "variables": "velDisp = \"Stellar velocity dispersion in km/s measured from the galaxy spectrum; 0 indicates a failed fit\"; signal_to_noise_r = \"Median spectral signal-to-noise ratio in the r-band (s.snMedian_r)\"; sample = 50,000 galaxies."}, {"card_id": "T23", "domain_label": "Astronomy", "dataset_desc": "50,000 SDSS galaxies with photometric and spectroscopic measurements.", "question": "Does the mean Petrosian radius differ across galaxy sub-classes, and if so which sub-class has the largest value?", "cells": ["Mean Petrosian radius is highest for starburst galaxies.", "Mean Petrosian radius is highest for AGN galaxies.", "Mean Petrosian radius does not differ across galaxy sub-classes."], "evidence": "One-way ANOVA of petroRad_r by subClass: mean Petrosian radii AGN 5.793070, STARBURST 4.001217; ANOVA results: F-statistic = 273.01, p-value = 0.0000. No CI or n reported.", "variables": "petroRad_r: 'Petrosian radius in the r band (arcsec); measures galaxy angular size'; subClass: 'Finer spectroscopic sub-classification (e.g. STARFORMING, STARBURST, AGN, BROADLINE, AGN BROADLINE); NaN when the pipeline could not assign a sub-class' — the comparison here covers AGN and STARBURST."}, {"card_id": "T24", "domain_label": "Labor economics / sociology", "dataset_desc": "12,686 respondents from a U.S. longitudinal survey (NLSY79).", "question": "Does family net wealth in 1996 differ between respondents who were convicted of an illegal act in adult court before 1980 and those who were not, and in which direction?", "cells": ["Conviction before 1980 is associated with higher family net wealth in 1996.", "Conviction before 1980 is associated with lower family net wealth in 1996.", "Conviction before 1980 is not associated with family net wealth in 1996."], "evidence": "Two-sample t-test of family net wealth in 1996 by pre-1980 conviction status: T-test statistics: 0.9990600851316653, P-value: 0.31850010836538617. No CI or n reported.", "variables": "'Ever convicted of an illegal act in adult court before 1980': 'Boolean variable that indicates if the respondent was convicted of an illegal act in adult court other than minor traffic violations before 1980' (1 if convicted, 0 if not; 374 respondents in each group); 'Family net wealth, 1996': 'Total Net Wealth for Family. Created by summing all asset values and subtracting all debts for the year 1996' (US dollars; values may be negative)."}, {"card_id": "T25", "domain_label": "Finance / lending", "dataset_desc": "2,380 U.S. mortgage applications with applicant and loan attributes.", "question": "Is denial of private mortgage insurance associated with denial of the mortgage application?", "cells": ["Denial of private mortgage insurance is significantly correlated with denial of the loan application.", "Denial of private mortgage insurance is not significantly correlated with denial of the loan application.", "Denial of private mortgage insurance is correlated, non-significantly, with acceptance of the loan application rather than with denial."], "evidence": "Pearson correlation plus logistic regression predicting deny from denied_PMI: Correlation coefficient between 'denied_PMI' and 'deny': 0.35215423344924524, P-value: 1.975733833487476e-70; Logit No. Observations: 2380, Pseudo R-squ.: 0.09544, LLR p-value: 4.394e-38. The logit coefficient table is cut off in the excerpt, so no coefficient or CI is available.", "variables": "denied_PMI: '1 if application was denied private mortgage insurance, 0 otherwise'; deny: '1 if mortgage application was denied, 0 if accepted'; accept is the complement of deny ('1 if mortgage application was accepted, 0 if denied')."}, {"card_id": "T26", "domain_label": "Materials science", "dataset_desc": "68,805 inorganic crystalline compounds with computed physical properties.", "question": "Is the number of atomic sites (nsites) correlated with band gap, and in which direction?", "cells": ["Higher nsites correspond to lower band gaps.", "Higher nsites correspond to higher band gaps.", "There is no significant relationship between nsites and band gap."], "evidence": "Spearman correlation between nsites and band_gap: Spearman's correlation coefficient: 0.4308, 95% Confidence Interval: [0.42464383 0.43680622]. n not reported.", "variables": "nsites: 'Number of atomic sites in the primitive unit cell'; band_gap: 'DFT-computed electronic band gap in eV (0 for metals); note GGA functionals underestimate true gaps'."}, {"card_id": "T27", "domain_label": "Software engineering", "dataset_desc": "276 survey respondents on requirements-engineering practices.", "question": "Is role diversity associated with the number of ML projects that reached deployment, and in which direction?", "cells": ["Greater role diversity is associated with a higher number of deployed ML projects.", "Role diversity is not associated with the number of deployed ML projects.", "Fewer roles are associated with a higher number of deployed ML projects."], "evidence": "OLS regression predicting D8_ML_Production from Role_Diversity: Role_Diversity coef -7.1413, std err 1.934, t -3.692, P>|t| 0.000, 95% CI [-10.949, -3.334], No. Observations: 276 (reported R-squared: -0.000, Df Model: 0, i.e. the model was fitted without an intercept).", "variables": "Role_Diversity: a derived count of distinct roles, not a documented dataset field; the underlying documented item is D4_Role ('Role that best describes the respondent's current activities within the company: Project Lead/Project Manager, Business Analyst, Requirements Engineer, Solution Architect, Data Scientist, Developer, Test Manager/Tester'). D8_ML_Production: 'Number of ML-enabled system projects that the respondent participated in that actually got deployed' (the raw column contains -99 sentinel values for missing responses)."}, {"card_id": "T28", "domain_label": "Labor economics / sociology", "dataset_desc": "12,686 respondents from a U.S. longitudinal survey (NLSY79).", "question": "Is rank in class in 1981 positively or negatively correlated with the ASVAB Arithmetic Reasoning Z score in 1981?", "cells": ["Rank in class is positively associated with the Arithmetic Reasoning Z score in 1981.", "Rank in class is negatively associated with the Arithmetic Reasoning Z score in 1981.", "There is no association between rank in class and the Arithmetic Reasoning Z score in 1981."], "evidence": "Correlation between rank in class (1981) and ASVAB Arithmetic Reasoning Z score (1981): Correlation Coefficient: -0.31, p-value: 0.0000, 95% Confidence Interval: (-0.33510105276474517, -0.28084566956735285). n not reported.", "variables": "'Rank in class last year attended at this school, 1981': 'Respondent's rank in the class that he attended in school last year (in 1980) (variable recorded in 1981)', numeric with recorded values 1 to 1053 — the documentation does not state whether 1 denotes the top or the bottom of the class; 'ASVAB - Arithmetic Reasoning Z Score (rounded), 1981': 'standardized scores of respondents on the Arithmetic Reasoning section of the ASVAB test' (recorded values 165 to 825)."}, {"card_id": "T29", "domain_label": "Finance / lending", "dataset_desc": "2,380 U.S. mortgage applications with applicant and loan attributes.", "question": "Controlling for other applicant characteristics, what is the sign of the effect of being married on mortgage denial?", "cells": ["Being married is associated with a higher probability of mortgage denial, after controlling for other factors.", "Being married is not associated with the probability of mortgage denial, after controlling for other factors.", "Being married is associated with a lower probability of mortgage denial, after controlling for other factors."], "evidence": "Logistic regression predicting deny with married plus covariates: Coefficient for 'married': -0.49722161209876853, confidence interval for 'married': [-0.798800, -0.195643]. n not reported in the excerpt.", "variables": "married: '1 if applicant is married, 0 otherwise'; deny: '1 if mortgage application was denied, 0 if accepted'; the model also adjusts for other applicant and loan characteristics in the dataset, which the excerpt does not list."}, {"card_id": "T30", "domain_label": "Materials science", "dataset_desc": "68,805 inorganic crystalline compounds with computed physical properties.", "question": "Which crystal system has the lowest mean band gap: hexagonal, trigonal, or monoclinic?", "cells": ["Hexagonal structures have the lowest mean band gap.", "Trigonal structures have the lowest mean band gap.", "Monoclinic structures have the lowest mean band gap.", "No crystal system has a distinguishably lowest mean band gap."], "evidence": "One-way ANOVA of band_gap by crystal_system with Tukey HSD post hoc: mean band_gap Hexagonal 0.507103, Monoclinic 1.891686, Trigonal 1.371823; F-statistic: 1606.1403, p-value: 0.0000e+00; Tukey HSD (FWER=0.05) Hexagonal-Monoclinic meandiff 1.3846 [1.3271, 1.4421], Hexagonal-Trigonal 0.8647 [0.7968, 0.9326], Monoclinic-Trigonal -0.5199 [-0.5768, -0.4629], all p-adj 0.0. n not reported.", "variables": "crystal_system: 'One of the 7 crystal systems: Cubic, Tetragonal, Orthorhombic, Hexagonal, Trigonal, Monoclinic, Triclinic' — the comparison here covers Hexagonal, Trigonal and Monoclinic; band_gap: 'DFT-computed electronic band gap in eV (0 for metals); note GGA functionals underestimate true gaps'."}, {"card_id": "T31", "domain_label": "Software engineering", "dataset_desc": "276 survey respondents on requirements-engineering practices.", "question": "Does perceived success of ML projects differ across the project management framework used?", "cells": ["CRISP-DM is associated with the highest perceived success in ML projects.", "Perceived success does not differ across project management frameworks.", "Scrum is associated with the highest perceived success in ML projects."], "evidence": "One-way ANOVA of the perceived-success measure across management frameworks: F-statistic: 1.3272, p-value: 0.2678. The outcome variable, group means, CIs, and n are not reported in the excerpt.", "variables": "D10_ML_Management_Framework_CRISP-DM and D10_ML_Management_Framework_Scrum: 'Participant responded with CRISP-DM / Scrum as the response for project management framework applied in the participated ML-enabled systems project' (one indicator column per framework, alongside None, Kanban, Lean, RUP, SAFe, Others); the perceived-success outcome is not named in the output — the documented success-related items are the Q1_ML_Life_Cycle_Importance_* fields ('the level of relevance of [stage] with regard to project success')."}, {"card_id": "T32", "domain_label": "Astronomy", "dataset_desc": "50,000 SDSS galaxies with photometric and spectroscopic measurements.", "question": "Do galaxies with high versus low velocity dispersion differ in how they are distributed over right ascension?", "cells": ["High velocity dispersion galaxies are more concentrated over the RA range than low velocity dispersion galaxies.", "Low velocity dispersion galaxies are more concentrated over the RA range than high velocity dispersion galaxies.", "RA concentration does not differ between high and low velocity dispersion galaxies."], "evidence": "Mann-Whitney U test comparing ra between high and low velDisp groups: Mann-Whitney U test statistics: 50993106.00, P-value: 0.0150; the output adds that high velocity dispersion galaxies have a lower mean RA than low velocity dispersion galaxies. No CI or n reported.", "variables": "velDisp: 'Stellar velocity dispersion in km/s measured from the galaxy spectrum; 0 indicates a failed fit', split into a high and a low group (the split point is not stated in the output); ra: 'Right ascension in J2000 decimal degrees (sky longitude, 0-360)'."}, {"card_id": "T33", "domain_label": "Finance / lending", "dataset_desc": "2,380 U.S. mortgage applications with applicant and loan attributes.", "question": "Do accepted and denied mortgage applications differ in their values of mortgage_credit, and which group has the higher values?", "cells": ["Accepted applications have higher values of mortgage_credit than denied applications.", "Denied applications have higher values of mortgage_credit than accepted applications.", "Values of mortgage_credit do not differ between accepted and denied applications."], "evidence": "Mann-Whitney U test and t-test comparing mortgage_credit between accepted and denied applications: Mann-Whitney U Statistic: 250913.0, p-value: 1.1562170799980968e-07; t-test Statistic: -5.470253614933339, p-value: 8.299260676592929e-08. No CI or n reported in the excerpt.", "variables": "mortgage_credit: 'Applicant's mortgage credit score', an integer from 1 to 4 — the documentation does not state which end of the 1-4 scale corresponds to a better credit rating; deny: '1 if mortgage application was denied, 0 if accepted' (n = 2,380 rows in the dataset)."}, {"card_id": "T34", "domain_label": "Materials science", "dataset_desc": "68,805 inorganic crystalline compounds with computed physical properties.", "question": "Do bulk modulus estimates differ across space group categories?", "cells": ["Bulk modulus estimates differ significantly across space group categories.", "Bulk modulus estimates do not differ significantly across space group categories."], "evidence": "One-way ANOVA of bulk modulus estimates across space group categories: ANOVA p-value: 0.9999999999999999. No F-statistic, degrees of freedom, CI, or n reported.", "variables": "bulk_modulus_vrh: 'Voigt-Reuss-Hill average bulk modulus K in GPa (the recommended scalar estimate). NaN when elasticity not computed' (available for roughly 14% of materials); spacegroup_number: 'International Tables space group number (1-230)' used as the grouping variable — the excerpt does not state how the space group categories were formed."}, {"card_id": "T35", "domain_label": "Software engineering", "dataset_desc": "276 survey respondents on requirements-engineering practices.", "question": "Does the degree to which non-functional requirements are considered in ML projects vary with company size?", "cells": ["Non-functional requirements receive uniformly low consideration across companies of all sizes.", "The consideration of non-functional requirements varies with company size.", "There is no clear pattern relating company size to the consideration of non-functional requirements."], "evidence": "Separate one-way ANOVAs of each Q11 NFR item by C(D3_Company_Size), df 7.0 with Residual df 268.0 throughout: Not_Considered F 1.241592, PR(>F) 0.280125; Data_Quality F 1.907793, PR(>F) 0.068462; Model_Accountability F 1.371039, PR(>F) 0.217643; Model_Ethics_Fairness F 1.185115, PR(>F) 0.311419. The excerpt is truncated mid-listing, so later NFR items are not shown; no CIs reported.", "variables": "D3_Company_Size: 'Size of the organization the respondent currently work for (1-10 employees, 11-50 employees ... more than 2000 employees)'; Q11_ML_NFRs_* items: 'Degree to which [data quality / model accountability / model ethics and fairness / etc.] is considered as a non-functional requirement in ML projects in the respondent's organization', plus Q11_ML_NFRs_Not_Considered ('Degree to which non-functional requirements are not considered'), each recorded as 'quoted' / 'not quoted' with -77 as a missing-value code."}, {"card_id": "T36", "domain_label": "Labor economics / sociology", "dataset_desc": "12,686 respondents from a U.S. longitudinal survey (NLSY79).", "question": "Are parents' highest completed grade levels correlated with respondents' 1981 ASVAB z-scores?", "cells": ["There is a significant correlation between parents' education levels and respondent's 1981 ASVAB scores.", "There is no significant correlation between parents' education levels and respondent's 1981 ASVAB scores."], "evidence": "Correlation of each 1981 ASVAB z-score with parents' completed grade -- for mother's education: Arithmetic Reasoning Correlation = 0.36, p-value = 0.0000; Word Knowledge Correlation = 0.43, p-value = 0.0000; Paragraph Comprehension Correlation = 0.38, p-value = 0.0000; Mathematics Knowledge Correlation = 0.39, p-value = 0.0000. The father's-education block is cut off mid-line (\"Arithmetic Reasoning ... Correlation = 0.3\"). No CI or n reported.", "variables": "\"Highest grade completed by respondent's mother, 1979\" and \"Highest grade completed by respondent's father, 1979\" = highest grade or year of regular school that the parent ever completed up to 1979; the four 1981 ASVAB variables (Arithmetic Reasoning, Word Knowledge, Paragraph Comprehension, Mathematics Knowledge) = \"standardized scores (z score, rounded) of respondents on that section of the ASVAB test\"."}, {"card_id": "T37", "domain_label": "Labor economics / sociology", "dataset_desc": "12,686 respondents from a U.S. longitudinal survey (NLSY79).", "question": "Is family size in 1979 correlated positively, negatively, or not at all with respondent's height in 1981?", "cells": ["Family size in 1979 correlates positively with respondent's height in 1981.", "Family size in 1979 has no correlation with respondent's height in 1981.", "Family size in 1979 correlates negatively with respondent's height in 1981."], "evidence": "Correlation between family size in 1979 and respondent's height in 1981 -- Correlation coefficient: -0.05, P-value: 3.1e-08; both columns reported with 0 missing values. No CI or n reported.", "variables": "\"Family size, 1979\" = family size of the respondent in 1979; \"Height of respondent, 1981\" = height of the respondent in inches in 1981."}, {"card_id": "T38", "domain_label": "Labor economics / sociology", "dataset_desc": "12,686 respondents from a U.S. longitudinal survey (NLSY79).", "question": "Does the occupation of the adult male in the respondent's household at age 14 predict total net family income in 1989?", "cells": ["Occupation of the adult male in the household at age 14 predicts 1989 family income.", "Occupation of the adult male in the household at age 14 does not predict 1989 family income."], "evidence": "OLS predicting 1989 total net family income from the occupation categories -- F-statistic: 1.235, Prob (F-statistic): 0.00218, R-squared: 0.034, Adj. R-squared: 0.006, Df Model: 344, No. Observations: 12534. The coefficient table is cut off after the constant (const 7020.2368, std err 6692.772, t 1.049, P>|t| 0.294), so individual occupation coefficients are not shown.", "variables": "\"Occupation of adult male in household at age 14, 1979\" = occupation of the father figure present in the respondent's household at age 14 (categorical; values include FARMER AND FARM MANAGERS, PROFESSIONAL, TECHNICAL AND KINDRED, etc.); \"Total net family income, previous calendar year, 1989\" = total net family income for the previous calendar year, recorded in 1989."}, {"card_id": "T39", "domain_label": "Software engineering", "dataset_desc": "276 survey respondents on requirements-engineering practices.", "question": "Which accounts for more variance in perceived ML project success, degree of ML documentation or degree of consideration of non-functional requirements?", "cells": ["Documentation explains the most variance.", "NFR consideration explains the most variance.", "Documentation and NFR consideration contribute comparably.", "Neither explains a meaningful share of the variance."], "evidence": "Comparison of two regressions of the same success outcome -- Documentation Model R-squared: 0.4974980199313186 versus NFR Model R-squared: 0.4710143908714276. No p-values, confidence intervals, or n reported in the excerpt.", "variables": "The Q10_ML_Documentation_* columns = \"Degree to which [vision documents / requirements lists / goal models / use case models / prototypes / user stories / BDD scenarios / ML Canvas / notebooks / data models] are used for ML documentation in the respondent's organization\"; the Q11_ML_NFRs_* columns = \"Degree to which [data quality, model accountability, ethics and fairness, explainability, reliability, security, ...] is considered as a non-functional requirement in ML projects in the respondent's organization\"; the excerpt does not name which specific documentation/NFR columns entered the two models, nor which column was used as the success outcome (the survey's only deployment-count column is D8_ML_Production = \"Number of ML-enabled system projects that the respondent participated in that actually got deployed\"). The response scales' ordering is not documented."}, {"card_id": "T40", "domain_label": "Software engineering", "dataset_desc": "276 survey respondents on requirements-engineering practices.", "question": "Is the number of ML projects deployed more strongly associated with technical roles (e.g. Data Scientist, Solution Architect) or with managerial roles (e.g. Project Lead, Tester)?", "cells": ["Roles such as 'Data Scientist' and 'Solution Architect' are the dominant contributors to deployment counts.", "Roles such as 'Project Lead' and 'Tester' are the dominant contributors to deployment counts.", "Both role groups contribute comparably to deployment counts.", "Neither role group contributes meaningfully to deployment counts."], "evidence": "OLS predicting D8_ML_Production from Tech_Role and Mgr_Role indicators -- Tech_Role coef 1.7633, std err 0.561, t 3.141, P>|t| 0.002, 95% CI [0.658, 2.869]; Mgr_Role coef 0.0630, std err 0.685, t 0.092, P>|t| 0.927, 95% CI [-1.286, 1.412]. Model R-squared: 0.011, Adj. R-squared: 0.003, F-statistic: 1.324, Prob (F-statistic): 0.268, No. Observations: 247.", "variables": "D8_ML_Production = \"Number of ML-enabled system projects that the respondent participated in that actually got deployed\"; D4_Role = \"Role that best describes the respondent's current activities within the company (Project Lead/Project Manager, Business Analyst, Requirements Engineer, Solution Architect, Data Scientist, Developer, Test Manager/Tester)\" -- Tech_Role and Mgr_Role are indicators the analysis derived from D4_Role, and the excerpt does not state which roles were assigned to each group."}, {"card_id": "T41", "domain_label": "Astronomy", "dataset_desc": "50,000 SDSS galaxies with photometric and spectroscopic measurements.", "question": "Is redshift correlated positively, negatively, or not at all with petroRad_r?", "cells": ["Positive relationship between redshift and Petrosian radius.", "No relationship between redshift and Petrosian radius.", "Negative relationship between redshift and Petrosian radius."], "evidence": "Spearman rank correlation between redshift and Petrosian radius -- Spearman correlation: -0.3169, 95% Confidence Interval: [-0.3252, -0.3090]. No p-value or n reported in the excerpt.", "variables": "redshift = \"Spectroscopic redshift z measured from galaxy emission/absorption lines (range restricted to 0.02-0.3 in this sample)\"; petroRad_r = \"Petrosian radius in the r band (arcsec); measures galaxy angular size\". Sample: 50,000 SDSS DR19 galaxies, one row per galaxy."}, {"card_id": "T42", "domain_label": "Online discourse", "dataset_desc": "7,975 contributions to online debate threads.", "question": "Do contributors coded male and contributors coded female differ in their mean number of contributions?", "cells": ["Mean contributions are higher for males than for females.", "Mean contributions are higher for females than for males.", "There is no significant difference in mean contributions between males and females."], "evidence": "T-test of contribution counts by gender -- Mean Contributions - Males: 21.316730523627076, Females: 6.603576751117735; t-statistic: 23.1424605687095, p-value: 3.152300361117105e-110. No confidence interval or per-group n reported.", "variables": "Male and Female are 0/1 indicator columns for the contributor's coded gender (coded by two independent coders from Edge.org profile pictures, or pictures and pronouns elsewhere); the dataset's info.json supplies no per-field descriptions, and the excerpt does not state which contribution-count column was used (candidates include ContributionsThisYear, range 1-290; PreviousContributions, range 0-488; ContributionsbyAuthor, range 1-214). 7,975 rows."}, {"card_id": "T43", "domain_label": "Software engineering", "dataset_desc": "276 survey respondents on requirements-engineering practices.", "question": "Is D9_ML_Project_Team_Size correlated positively, negatively, or not at all with D8_ML_Production?", "cells": ["Team size correlates positively with the number of projects deployed.", "Team size does not correlate with the number of projects deployed (neither positively nor negatively).", "Team size correlates negatively with the number of projects deployed."], "evidence": "Spearman rank correlation between team size and number of projects deployed -- Spearman Correlation Coefficient: 0.439, p-value: 0.000, 95% Confidence Interval: [0.335, 0.537]. n not reported in the excerpt.", "variables": "D9_ML_Project_Team_Size = \"The Team size of the ML-enabled system projects that the respondent participated in\"; D8_ML_Production = \"Number of ML-enabled system projects that the respondent participated in that actually got deployed\"."}, {"card_id": "T44", "domain_label": "Online discourse", "dataset_desc": "7,975 contributions to online debate threads.", "question": "Is Years_from_PhD correlated positively, negatively, or not at all with Total_Citations?", "cells": ["Positive relationship between years from PhD and total citations.", "Negative relationship between years from PhD and total citations.", "No significant relationship between years from PhD and total citations."], "evidence": "Pearson correlation between years from PhD and total citations -- Correlation coefficient: 0.605, p-value: 0.000; the accompanying OLS with Total_Citations as dependent variable reports R-squared 0.366, F-statistic 926.2, Prob (F-statistic) 5.69e-161, No. Observations: 1606. No confidence interval reported.", "variables": "Years_from_PhD = years elapsed since the contributor's PhD (observed range -14.0 to 73.0); Total_Citations = the contributor's total citation count (observed range 80 to 143,833). The dataset's info.json supplies no per-field descriptions, so the meaning of negative Years_from_PhD values is undocumented."}, {"card_id": "T45", "domain_label": "Finance / lending", "dataset_desc": "2,380 U.S. mortgage applications with applicant and loan attributes.", "question": "Does marital status change the association between PI_ratio and mortgage denial?", "cells": ["PI_ratio is more strongly associated with denial for married applicants.", "PI_ratio is more strongly associated with denial for unmarried applicants.", "PI_ratio is associated with denial equally for married and unmarried applicants.", "PI_ratio is not associated with denial."], "evidence": "Logit predicting deny from PI_ratio, married, and their interaction -- interaction coef 0.5084, std err 1.536, z 0.331, P>|z| 0.741, 95% CI [-2.502, 3.519] (reported again as Interaction Coefficient: 0.5083957849424734, Interaction P-value: 0.7406518112347411); PI_ratio coef 6.0006, std err 1.042, z 5.759, P>|z| 0.000, CI [3.958, 8.043]; married coef -0.6077, std err 0.562, z -1.081, P>|z| 0.280, CI [-1.709, 0.494]; Pseudo R-squ.: 0.04918, LLR p-value: 2.711e-18. n not shown in the excerpt.", "variables": "PI_ratio = \"Total debt payments to income ratio\" (range 0.0-0.95); married = \"1 if applicant is married, 0 otherwise\"; deny = \"1 if mortgage application was denied, 0 if accepted\"; interaction = PI_ratio x married. 2,380 mortgage applications."}, {"card_id": "T46", "domain_label": "Online discourse", "dataset_desc": "7,975 contributions to online debate threads.", "question": "Do conversations coded Type = 1 and Type = 2 differ in contribution volume?", "cells": ["Conversation type is associated with contribution volume.", "Conversation type is not associated with contribution volume."], "evidence": "One-way ANOVA of contribution volume by conversation type -- group summaries: Type 1 mean 0.000000, median 0.0; Type 2 mean 98.078372, median 43.0; ANOVA Result: F-statistic = 1375.75, p-value = 0.0000. Per-group n not reported.", "variables": "Type = conversation type, coded 1 or 2 (the dataset's info.json supplies no per-field descriptions, so what the two codes denote is undocumented); the excerpt does not name the contribution-volume column (candidates include DebateSize, range 1-436; Male_Contributions, range 0-436; Female_Contributions, range 0-39; NumberofAuthorContributions, range 0-431). 7,975 rows across 522 threads."}, {"card_id": "T47", "domain_label": "Finance / lending", "dataset_desc": "2,380 U.S. mortgage applications with applicant and loan attributes.", "question": "Does loan_to_value predict whether a mortgage application is accepted, and in which direction?", "cells": ["Higher loan_to_value significantly predicts a higher probability of acceptance", "Higher loan_to_value significantly predicts a lower probability of acceptance", "loan_to_value does not significantly predict acceptance"], "evidence": "Logistic regression predicting acceptance from loan_to_value: Coefficient of Loan_to_value: -3.2959352003050153, 95% Confidence Interval: [-4.15303776 -2.43883264], P-value: 4.81197737676002e-14.", "variables": "loan_to_value = ratio of loan amount to appraised value of the property (range 0.02-1.95); acceptance is the binary application outcome (accept = 1 if accepted, 0 if denied; equivalently deny = 1 if denied, 0 if accepted)."}, {"card_id": "T48", "domain_label": "Online discourse", "dataset_desc": "7,975 contributions to online debate threads.", "question": "What is the form of the relationship between an author's H-index and their number of contributions?", "cells": ["Linear positive relationship between H-index and contributions", "Linear negative relationship between H-index and contributions", "Nonlinear or no relationship between H-index and contributions"], "evidence": "OLS with the contribution count as dependent variable and H-index as predictor: x1 coef -0.3051, t -3.072, P>|t| 0.002, [0.025 0.975] -0.500 to -0.110, R-squared 0.006, No. Observations: 1678; no nonlinear model appears in the excerpt.", "variables": "H_Index = author h-index (values 4-136); contributions = an author contribution count (the excerpt labels the outcome y and the predictor x1 and does not name the exact column; this dataset supplies column names and ranges but no field-level descriptions)."}, {"card_id": "T49", "domain_label": "Labor economics / sociology", "dataset_desc": "12,686 respondents from a U.S. longitudinal survey (NLSY79).", "question": "Does the variance of 1981 ASVAB subtest scores differ between male and female respondents, and is any difference consistent across subtests?", "cells": ["ASVAB scores show higher variance in males across all test areas", "ASVAB scores show higher variance in females across all test areas", "There is no consistent gender-based difference in variance of ASVAB scores"], "evidence": "Variance comparison by sex, per subtest: Arithmetic Reasoning Male Variance: 10988.289, Female Variance: 8847.556, p-value: 0.000; Word Knowledge Male Variance: 10967.956, Female Variance: 9855.596, p-value: 0.054; Paragraph Comprehension Male Variance: 10469.620, Female Variance: 9677.874, p-value: 0.000.", "variables": "Sex of respondent, 1979 (1 = MALE, 2 = FEMALE); ASVAB Arithmetic Reasoning / Word Knowledge / Paragraph Comprehension Z Score (rounded), 1981 = standardized subtest scores stored as rounded integers (e.g. Word Knowledge runs 168-825 in the file)."}, {"card_id": "T50", "domain_label": "Online discourse", "dataset_desc": "7,975 contributions to online debate threads.", "question": "Do an author's previous contributions predict their contributions in the current year?", "cells": ["Previous contribution history has a significant effect on current year contributions", "Previous contribution history does not have a significant effect on current year contributions"], "evidence": "Regression predicting current-year contributions from previous contributions: Coefficient for PreviousContributions: 0.03032395909660924, 95% Confidence Interval: [0.00660276 0.05404516].", "variables": "PreviousContributions = count of the author's earlier contributions (0-488); ContributionsThisYear = count of the author's contributions in the current year (1-290); this dataset supplies column names and ranges but no field-level descriptions."}, {"card_id": "T51", "domain_label": "Finance / lending", "dataset_desc": "2,380 U.S. mortgage applications with applicant and loan attributes.", "question": "Does marital status change the size of the association between housing_expense_ratio and mortgage denial?", "cells": ["Housing expense ratio is associated with denial to the same degree among married and unmarried applicants", "Housing expense ratio is associated with denial more strongly for married applicants", "Housing expense ratio is associated with denial more strongly for unmarried applicants", "Housing expense ratio has no association with denial for either group"], "evidence": "Logistic regression of denial on housing_expense_ratio, married and their interaction: housing_expense_ratio coef 3.3997 (z 3.423, P>|z| 0.001, [1.453, 5.347]); married coef -0.8909 (z -2.009, P>|z| 0.045, [-1.760, -0.022]); housing_expense_ratio:married coef 1.7355 (z 1.113, P>|z| 0.266, [-1.322, 4.793]); Log-Likelihood: -847.21, LLR p-value: 1.165e-10.", "variables": "housing_expense_ratio = housing expense as a ratio of total income (0-3); married = 1 if applicant is married, 0 otherwise; deny = 1 if mortgage application was denied, 0 if accepted."}, {"card_id": "T52", "domain_label": "Software engineering", "dataset_desc": "276 survey respondents on requirements-engineering practices.", "question": "Is D5_Software_Experience associated with Q9_ML_Elicitation_Observation?", "cells": ["Respondents with more years of software experience report greater use of observation for elicitation", "Years of software experience are not associated with use of observation for elicitation", "Respondents with fewer years of software experience report greater use of observation for elicitation"], "evidence": "Spearman correlation between D5_Software_Experience and Q9_ML_Elicitation_Observation: Spearman Correlation: 0.011, 95% Confidence Interval: [-0.103, 0.130] (bootstrapped).", "variables": "D5_Software_Experience = years of experience developing software-based products (integer years; -99 appears as a missing-data code); Q9_ML_Elicitation_Observation = degree to which observation is used for ML requirements elicitation in the respondent's organisation, stored in the file as 'quoted' / 'not quoted' (-77 missing); the polarity of the 'quoted' coding is not documented."}, {"card_id": "T53", "domain_label": "Online discourse", "dataset_desc": "7,975 contributions to online debate threads.", "question": "Is DebateSize associated with FemaleParticipation, and in which direction?", "cells": ["Effect of DebateSize on FemaleParticipation is positive", "Effect of DebateSize on FemaleParticipation is negative", "No significant effect of DebateSize on FemaleParticipation"], "evidence": "OLS with Dep. Variable: FemaleParticipation and predictor DebateSize: coef -0.0002, std err 1.26e-05, t -12.629, P>|t| 0.000, R-squared: 0.020, No. Observations: 7975 (the confidence interval is truncated in the excerpt).", "variables": "DebateSize = number of contributions in the debate thread (1-436); FemaleParticipation = share of contributions in the thread made by women (0-1); this dataset supplies column names and ranges but no field-level descriptions."}, {"card_id": "T54", "domain_label": "Online discourse", "dataset_desc": "7,975 contributions to online debate threads.", "question": "Does the variance of Male_Contributions differ across levels of AcademicHierarchyStrict?", "cells": ["Higher variance in Male_Contributions at higher values of AcademicHierarchyStrict", "Higher variance in Male_Contributions at lower values of AcademicHierarchyStrict", "No significant difference in variance of Male_Contributions across AcademicHierarchyStrict levels"], "evidence": "Levene's test of Male_Contributions variance across hierarchy levels: group variances 3.0 3049.091355, 4.0 13751.759359, 5.0 15343.987766, 6.0 20596.598610 (levels below 3.0 cut off); Test Statistic: 18.491575832315082, P-value: 4.453498259944527e-15.", "variables": "Male_Contributions = count of contributions by men in a thread (0-436); AcademicHierarchyStrict = ordinal academic hierarchy level coded 1.0-6.0 (this dataset gives no field descriptions, so which end of the 1-6 scale is the senior end is not documented)."}, {"card_id": "T55", "domain_label": "Online discourse", "dataset_desc": "7,975 contributions to online debate threads.", "question": "Is the numeric US News ranking value of an author's workplace associated with the number of contributions by that author, and in which direction?", "cells": ["Higher values of the workplace US News ranking variable go with more contributions by the author", "Lower values of the workplace US News ranking variable go with more contributions by the author", "The workplace US News ranking variable is not associated with the number of contributions by the author"], "evidence": "Correlation between the workplace US News ranking value and number of contributions by author: Correlation Coefficient: -0.23403087887923268, P-value: 1.0954101119732005e-39.", "variables": "Workplace US News ranking = numeric institutional rank of the author's workplace (Workplace_US_IR runs 1-481, Workplace_US runs 1-181; the excerpt does not say which column was used, and the dataset does not document whether a smaller number means a better-ranked institution); contributions = per-author contribution count (ContributionsbyAuthor, 1-214)."}, {"card_id": "T56", "domain_label": "Materials science", "dataset_desc": "68,805 inorganic crystalline compounds with computed physical properties.", "question": "Across the sampled materials, is efermi correlated with density, and if so in which direction?", "cells": ["efermi is positively correlated with density", "efermi is negatively correlated with density", "There is no significant correlation between efermi and density"], "evidence": "Pearson correlation of efermi with density: Pearson correlation coefficient: 0.626, P-value: 0.000, 95% Confidence Interval: [0.622, 0.631] (n not reported in the excerpt).", "variables": "efermi = DFT-computed Fermi level energy in eV; density = mass density in g/cm^3; one row per unique material_id (68,805 inorganic crystalline compounds)."}, {"card_id": "T57", "domain_label": "Astronomy", "dataset_desc": "50,000 SDSS galaxies with photometric and spectroscopic measurements.", "question": "Does petroR50_r predict extinction_u, and if so with what sign?", "cells": ["Positive effect of petroR50_r on extinction_u", "No effect of petroR50_r on extinction_u", "Negative effect of petroR50_r on extinction_u"], "evidence": "Linear fit of extinction_u on petroR50_r: Pearson correlation coefficient: -0.005, p-value: 0.232; Slope: -0.000, 95% Confidence Interval for the Slope: (-0.001, 0.000) (n not reported in the excerpt).", "variables": "petroR50_r = r-band radius enclosing 50% of the Petrosian flux in arcsec (half-light radius; -9999 is an SDSS no-data sentinel); extinction_u = Galactic dust extinction in the u band in magnitudes (SFD98 dust maps); 50,000 unique galaxies."}, {"card_id": "T58", "domain_label": "Software engineering", "dataset_desc": "276 survey respondents on requirements-engineering practices.", "question": "Does the proportion of respondents reporting Python differ between Solution Architect and Developer roles?", "cells": ["Python is reported more often in Solution Architect roles", "Python is reported more often in Developer roles", "No significant role-based difference in Python usage"], "evidence": "Two-sample t-test of the Python indicator by role: Python usage among Solution Architects: 0.83, Python usage among Developers: 0.74, T-statistic: -1.0761, p-value: 0.2849 (n not reported in the excerpt).", "variables": "D13_ML_Programming_Language_Python = per-respondent indicator of whether Python was among the languages used in their ML-enabled system projects (raw values 'quoted' / 'not quoted', analysed as 1/0); D4_Role = respondent's current role, here restricted to the Solution Architect and Developer categories."}, {"card_id": "T59", "domain_label": "Labor economics / sociology", "dataset_desc": "12,686 respondents from a U.S. longitudinal survey (NLSY79).", "question": "Is the constructed family_support variable associated with respondents' highest grade completed, and with what sign?", "cells": ["family_support has a positive linear relationship with the educational-attainment outcome", "family_support has no linear relationship with the educational-attainment outcome", "family_support has a negative linear relationship with the educational-attainment outcome"], "evidence": "OLS regression of 'Highest grade completed, 1979' on family_support: family_support 0.6811, std err 0.021, t 31.7 (row truncated); R-squared: 0.088, F-statistic: 1007., Prob (F-statistic): 6.31e-211, No. Observations: 10399.", "variables": "family_support = analysis-constructed composite of 'Highest grade completed by respondent's mother, 1979', 'Highest grade completed by respondent's father, 1979' and 'Family size, 1979'; its construction, and therefore which end of its scale is high, is not documented. Dependent variable 'Highest grade completed, 1979' = highest grade or year of regular school the respondent completed and got credit for by 1979."}, {"card_id": "T60", "domain_label": "Labor economics / sociology", "dataset_desc": "12,686 respondents from a U.S. longitudinal survey (NLSY79).", "question": "Does the variance of respondent height in 1985 differ by sex, and if so which group has the larger variance?", "cells": ["Height variance in 1985 is higher among males than among females", "Height variance in 1985 is higher among females than among males", "No significant difference in height variance by sex in 1985"], "evidence": "Levene test of 1985 height variance by sex: Variance of Male Height in 1985: 9.332577299379471, Variance of Female Height in 1985: 7.719752862238183, Levene's test statistic: 53.9169482693558, p-value: 2.2411999338704924e-13 (n not reported in the excerpt).", "variables": "'Height of respondent, 1985' = respondent height in inches in 1985; 'Sex of respondent, 1979' = 1:MALE or 2:FEMALE."}, {"card_id": "T61", "domain_label": "Materials science", "dataset_desc": "68,805 inorganic crystalline compounds with computed physical properties.", "question": "Does the association between magnetic ordering and band_gap differ between materials with theoretical = True and materials with theoretical = False?", "cells": ["Magnetic ordering is associated with band_gap only among materials with theoretical = False.", "Magnetic ordering is associated with band_gap only among materials with theoretical = True.", "Magnetic ordering is associated with band_gap among both theoretical = False and theoretical = True materials.", "Magnetic ordering is associated with band_gap in neither group."], "evidence": "Correlation between volume and efermi -- Correlation Coefficient: -0.2382392541284045, P-value: 0.0. No confidence interval or n reported in the excerpt.", "variables": "band_gap = \"DFT-computed electronic band gap in eV (0 for metals); note GGA functionals underestimate true gaps\"; ordering = \"Magnetic ordering: 'NM' (non-magnetic), 'FM' (ferromagnetic), 'AFM' (antiferromagnetic), 'FiM' (ferrimagnetic), or 'Unknown'\"; theoretical = \"Boolean: True if the material is a hypothetical / not-yet-synthesized structure (as opposed to experimentally observed in ICSD)\"."}, {"card_id": "T62", "domain_label": "Materials science", "dataset_desc": "68,805 inorganic crystalline compounds with computed physical properties.", "question": "Does spacegroup predict whether a material is stable only above a density threshold, only below a density threshold, at all densities, or not at all?", "cells": ["Spacegroup predicts material stability only among materials whose density exceeds a threshold.", "Spacegroup predicts material stability only among materials whose density is below a threshold.", "Spacegroup predicts material stability at all levels of density.", "Spacegroup does not predict material stability at any level of density."], "evidence": "Pearson correlation between energy above hull and volume: Pearson correlation coefficient: -0.0325, 95% confidence interval: (-0.0399, -0.0250).", "variables": "spacegroup_number: 'International Tables space group number (1-230)'; density: 'Mass density in g/cm^3'; is_stable: 'True if the material lies exactly on the convex hull (ground state at its composition)' (1 if stable, 0 otherwise)."}, {"card_id": "T63", "domain_label": "Astronomy", "dataset_desc": "50,000 SDSS galaxies with photometric and spectroscopic measurements.", "question": "After removing the effect of velocity dispersion on redshift, is right ascension correlated with the redshift residuals, and in which direction?", "cells": ["Right ascension is positively correlated with redshift residuals after accounting for velocity dispersion.", "Right ascension is negatively correlated with redshift residuals after accounting for velocity dispersion.", "Right ascension is not significantly correlated w
