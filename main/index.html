ith redshift residuals after accounting for velocity dispersion."], "evidence": "Pearson correlation between extinction_u and petroRad_r: 0.005124138464838191, p-value: 0.2518898887078509; companion OLS gives R-squared: 0.000, Prob (F-statistic): 0.252, No. Observations: 50000 (its coefficient table is truncated).", "variables": "ra: 'Right ascension in J2000 decimal degrees (sky longitude, 0-360)'; redshift: 'Spectroscopic redshift z measured from galaxy emission/absorption lines (range restricted to 0.02-0.3 in this sample)'; velDisp: 'Stellar velocity dispersion in km/s measured from the galaxy spectrum; 0 indicates a failed fit'. The outcome is the residual of redshift after adjusting for velDisp."}, {"card_id": "T64", "domain_label": "Online discourse", "dataset_desc": "7,975 contributions to online debate threads.", "question": "Do contributors coded as academic account for more contributions than contributors coded as non-academic?", "cells": ["Most contributions come from academic contributors.", "Most contributions come from non-academic contributors.", "Neither group accounts for the majority of contributions."], "evidence": "OLS predicting DebateSize from author contributions: Pearson correlation: 0.83, P-value: 0.000; regression coefficient 0.7865; R-squared: 0.697, No. Observations: 7975.", "variables": "Academic - binary contributor indicator taking values 0.0 and 1.0 (1.0 = contributor classified as academic; the codebook lists no text description beyond the coding), tallied over the 7,975 contribution rows collected from Edge.org conversations and annual questions."}, {"card_id": "T65", "domain_label": "Finance / lending", "dataset_desc": "2,380 U.S. mortgage applications with applicant and loan attributes.", "question": "Does the association between mortgage_credit and denial differ between applicants with a high versus a low housing_expense_ratio?", "cells": ["mortgage_credit is associated with denial only in the high housing_expense_ratio group.", "mortgage_credit is associated with denial only in the low housing_expense_ratio group.", "mortgage_credit is associated with denial to the same degree in the high and the low housing_expense_ratio groups."], "evidence": "Levene's test on denial rates by race: variance for Black applicants 0.20359218725454264 vs non-Black applicants 0.08406778684036084; Levene's test statistic: 104.49006694970888, Levene's test p-value: 4.923410652313397e-24.", "variables": "deny = \"1 if mortgage application was denied, 0 if accepted\"; mortgage_credit = \"Applicant's mortgage credit score\", an integer taking values 1-4 (the documentation does not state which end of the 1-4 scale corresponds to better or worse credit); housing_expense_ratio = \"Housing expense as a ratio of total income\" (0.0-3.0), split by the analysis into high and low groups; full dataset n = 2,380 applications."}, {"card_id": "T66", "domain_label": "Finance / lending", "dataset_desc": "2,380 U.S. mortgage applications with applicant and loan attributes.", "question": "Are applications with denied_PMI = 1 concentrated among applicants with high loan_to_value, among applicants with bad_history, among applicants with both, or neither?", "cells": ["Applications with denied_PMI = 1 occur predominantly among applicants with both high loan_to_value and bad_history = 1.", "Applications with denied_PMI = 1 occur predominantly among applicants with high loan_to_value only.", "Applications with denied_PMI = 1 occur predominantly among applicants with bad_history = 1 only.", "Applications with denied_PMI = 1 show no predominant pattern in loan_to_value or bad_history."], "evidence": "Logistic regression of denial on housing_expense_ratio, C(married) and their interaction: housing_expense_ratio coef 3.3997 (z 3.423, P>|z| 0.001, [1.453, 5.347]); C(married)[T.1.0] coef -0.8909 (z -2.009, P>|z| 0.045, [-1.760, -0.022]); housing_expense_ratio:C(married)[T.1.0] coef 1.7355 (z 1.113, P>|z| 0.266, [-1.322, 4.793]); LLR p-value: 1.165e-10.", "variables": "denied_PMI = \"1 if application was denied private mortgage insurance, 0 otherwise\"; loan_to_value = \"Ratio of loan amount to appraised value of property\" (0.02-1.95); bad_history = \"1 if applicant has history of bad credit, 0 otherwise\"; full dataset n = 2,380 applications."}, {"card_id": "T67", "domain_label": "Labor economics / sociology", "dataset_desc": "12,686 respondents from a U.S. longitudinal survey (NLSY79).", "question": "How is a respondent's weekly study time related to their exam score?", "cells": ["More study time is associated with higher exam scores", "Study time is not associated with exam scores"], "evidence": "OLS regression predicting exam_score from study_hours: coefficient = +1.42, 95% CI [0.61, 2.23], n = 812.", "variables": "study_hours — self-reported hours of study per week. exam_score — final exam score, 0-100."}, {"card_id": "T68", "domain_label": "Finance / lending", "dataset_desc": "2,380 U.S. mortgage applications with applicant and loan attributes.", "question": "Among applicants with a co-signer, how is loan size related to approval?", "cells": ["Among co-signed applicants, larger loans are associated with lower approval", "Among co-signed applicants, higher loan amounts go together with reduced approval rates", "Loan size is not associated with approval among co-signed applicants"], "evidence": "Logistic regression predicting approved from loan_amount, restricted to co-signed applications: coefficient = -0.22, 95% CI [-0.38, -0.06], n = 641.", "variables": "loan_amount — requested loan in US dollars. approved — 1 if the application was approved, 0 otherwise. cosigner — 1 if a co-signer was listed."}], "blocks": [["T40", "T28", "T66", "T65", "T01", "T37", "T54", "T15", "T32", "T07", "T11", "T33", "T19", "T48", "T18"], ["T40", "T28", "T66", "T65", "T01", "T37", "T54", "T15", "T32", "T07", "T11", "T33", "T19", "T48", "T18"], ["T27", "T21", "T06", "T04", "T58", "T68", "T23", "T44", "T50", "T38", "T55", "T63", "T47", "T08", "T05"], ["T27", "T21", "T06", "T04", "T58", "T68", "T23", "T44", "T50", "T38", "T55", "T63", "T47", "T08", "T05"], ["T22", "T07", "T65", "T17", "T11", "T12", "T58", "T25", "T20", "T55", "T52", "T19", "T37", "T09", "T66"], ["T22", "T07", "T65", "T17", "T11", "T12", "T58", "T25", "T20", "T55", "T52", "T19", "T37", "T09", "T66"], ["T35", "T42", "T67", "T53", "T47", "T03", "T01", "T18", "T57", "T59", "T49", "T13", "T60", "T23", "T61"], ["T35", "T42", "T67", "T53", "T47", "T03", "T01", "T18", "T57", "T59", "T49", "T13", "T60", "T23", "T61"], ["T01", "T10", "T26", "T13", "T28", "T68", "T31", "T20", "T14", "T35", "T09", "T44", "T63", "T29", "T04"], ["T01", "T10", "T26", "T13", "T28", "T68", "T31", "T20", "T14", "T35", "T09", "T44", "T63", "T29", "T04"], ["T15", "T17", "T67", "T11", "T40", "T27", "T47", "T57", "T56", "T53", "T45", "T41", "T60", "T61", "T19"], ["T15", "T17", "T67", "T11", "T40", "T27", "T47", "T57", "T56", "T53", "T45", "T41", "T60", "T61", "T19"], ["T42", "T43", "T64", "T20", "T30", "T29", "T25", "T24", "T22", "T16", "T39", "T62", "T41", "T03", "T59"], ["T09", "T35", "T67", "T12", "T57", "T53", "T31", "T60", "T46", "T26", "T13", "T61", "T45", "T10", "T14"], ["T50", "T04", "T36", "T12", "T20", "T23", "T34", "T64", "T56", "T63", "T52", "T49", "T51", "T17", "T02"], ["T62", "T10", "T44", "T05", "T60", "T27", "T55", "T30", "T19", "T09", "T43", "T32", "T28", "T51", "T66"], ["T46", "T21", "T59", "T31", "T41", "T68", "T48", "T34", "T26", "T14", "T56", "T61", "T40", "T13", "T03"], ["T65", "T04", "T51", "T31", "T50", "T41", "T10", "T34", "T14", "T38", "T16", "T48", "T30", "T24", "T62"], ["T05", "T23", "T02", "T59", "T55", "T62", "T46", "T16", "T32", "T64", "T43", "T07", "T24", "T39", "T21"], ["T34", "T54", "T49", "T64", "T08", "T12", "T58", "T65", "T52", "T48", "T33", "T37", "T22", "T51", "T06"]], "deploy": {"datapipe_id": "dD85QgeiH83u", "data_url": "https://pipe.jspsych.org/api/data/", "condition_url": "https://pipe.jspsych.org/api/condition/", "completion_url": "https://app.prolific.com/submissions/complete?cc=C8ZT0BYJ", "screened_out_url": "https://app.prolific.com/submissions/complete?cc=CD6Q4X1T"}, "q1_tail": ["None of these is supported by the result", "Cannot tell from this result"], "q_set": ["Yes — they are distinct and capture the scientifically plausible explanations", "No — a scientifically plausible explanation is missing from the set", "No — two or more of them could both be true at once", "No — both of those problems apply"], "q_value": ["A substantive finding worth reporting", "A minor or descriptive result", "Too obvious to be worth stating", "Not a finding — the analysis does not support a claim"], "q_analysis": ["Yes — the variables and test are an appropriate way to address the question", "No — the variables or test chosen do not fit the question", "Can't tell from what is shown"]};
(function(){
  const S = window.SURVEY, app = document.getElementById('app');
  const prog = document.getElementById('prog'), ticker = document.getElementById('ticker');
  const st = { i:0, flow:[], resp:[], screenPass:0, started:new Date().toISOString() };
  const P = new URLSearchParams(location.search);
  const PID = { prolific_pid:P.get('PROLIFIC_PID'), study_id:P.get('STUDY_ID'), session_id:P.get('SESSION_ID') };
  const CFG = S.deploy || {};
  const hash = t => { let h=0; for(const c of String(t)) h=(h*31+c.charCodeAt(0))|0; return Math.abs(h); };
  let blockIdx = 0, myIds = new Set(S.trials.map(t=>t.card_id));
  const fallbackIdx = () => (S.blocks && S.blocks.length)
    ? (PID.prolific_pid ? hash(PID.prolific_pid) % S.blocks.length
                        : Math.floor(Math.random()*S.blocks.length)) : 0;
  const getBlock = () => (CFG.datapipe_id && CFG.condition_url)
    ? fetch(CFG.condition_url, {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({experimentID: CFG.datapipe_id})})
        .then(r=>r.json()).then(j=> typeof j.condition === 'number' ? j.condition : fallbackIdx())
        .catch(()=> fallbackIdx())
    : Promise.resolve(fallbackIdx());
  const esc = s => String(s==null?'':s).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
  const LETTER = i => String.fromCharCode(65+i);

  function appendTrials(idx){
    blockIdx = idx % S.blocks.length;
    myIds = new Set(S.blocks[blockIdx] || S.trials.map(t=>t.card_id));
    const f = st.flow;
    f.push({type:'primer'});
    shuffle(S.trials.filter(t=>myIds.has(t.card_id))).forEach(t=>{
      f.push({type:'trial', t, perm: shuffle(t.cells.map((_,i)=>i))});
    });
    f.push({type:'end'});
    st.qTotal = f.filter(s=>s.type==='screener'||s.type==='trial').length;
  }

  function buildFlow(){
    const f = [{type:'intro'}];
    S.screener.forEach((q,idx)=> f.push({type:'screener', q, idx, last: idx===S.screener.length-1}));
    st.flow = f;
    st.qTotal = f.length;      // provisional until the block is known
    st.qDone = 0;
  }

  function radioGroup(name, q, choices, letters){
    return `<div class="grp"><div class="q">${esc(q)}</div><div class="opts" data-grp="${name}">`+
      choices.map((c,i)=>`<label class="opt"><input type="radio" name="${name}" value="${i}">`+
        (letters && i<letters.length ? `<span class="kk">${letters[i]}</span>` : '')+
        `<span>${esc(c)}</span></label>`).join('')+`</div></div>`;
  }
  function wireOpts(){
    app.querySelectorAll('.opts').forEach(g=> g.querySelectorAll('.opt').forEach(o=>{
      o.addEventListener('click',()=>{
        g.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
        o.classList.add('sel'); o.querySelector('input').checked=true;
        const fu = g.parentElement.querySelector('.followup');
        if(fu) fu.classList.toggle('on', o.querySelector('input').value === fu.dataset.showon);
        validate();
      });
    }));
  }
  function collect(names){
    const out={}; let ok=true;
    names.forEach(n=>{ const el=app.querySelector(`input[name="${n}"]:checked`);
      if(!el){ok=false;} else out[n]=Number(el.value); });
    return {ok, out};
  }
  let curNames=[];
  function validate(){ const {ok}=collect(curNames); const b=app.querySelector('#go'); if(b) b.disabled=!ok; }

  function frame(inner, names, btn){
    curNames = names||[];
    app.innerHTML = inner + `<div class="foot"><button class="go" id="go" ${names&&names.length?'disabled':''}>${btn||'Continue'}</button></div>`+
      `<div class="warnmsg" id="warn"></div>`;
    wireOpts();
    app.querySelector('#go').addEventListener('click', onContinue);
    prog.style.width = Math.round(100*st.qDone/Math.max(1,st.qTotal))+'%';
    ticker.textContent = names.length ? `${Math.min(st.qDone+1,st.qTotal)} / ${st.qTotal}` : '';
  }

  function onContinue(){
    const s = st.flow[st.i];
    if(curNames.length){
      const {ok,out}=collect(curNames);
      if(!ok){ app.querySelector('#warn').textContent='Answer every question to continue.'; return; }
      record(s, out); st.qDone++;
      if(s.type==='screener'){
        if(out[`scr_${s.idx}`]===s.q.correct) st.screenPass++;
        if(s.last && st.screenPass<2){ renderScreenedOut(); return; }
        if(s.last){                      // gate passed -> now we need the block
          getBlock().then(idx=>{ appendTrials(idx); st.i++; render(); });
          return;
        }
      }
    }
    st.i++; render();
  }

  function record(s, out){
    const base={ts:new Date().toISOString(), type:s.type};
    if(s.type==='screener'){
      st.resp.push({...base, key:`screener_${s.idx}`, value:out[`scr_${s.idx}`], correct:s.q.correct});
      return;
    }
    const id=s.t.card_id, K=s.t.cells.length, pick=out[`${id}__q1`];
    const canonical = pick < K ? s.perm[pick] : null;
    const q1kind = pick < K ? 'cell' : (pick===K ? 'none_supported' : 'cannot_tell');
    const setTxt = app.querySelector(`#setwhy_${id}`);
    st.resp.push({...base, card_id:id, q1_display_idx:pick, q1_canonical_idx:canonical,
      q1_kind:q1kind, q_set:out[`${id}__qset`],
      q_set_text:(setTxt && setTxt.value ? setTxt.value.trim() : ''),
      q_value:out[`${id}__qval`], q_analysis:out[`${id}__qanalysis`], perm:s.perm.join(',')});
  }

  function renderIntro(){
    frame(`<p class="eyebrow">About 20 minutes · begins with 3 screening questions</p>
      <h1>Which explanation does the evidence support?</h1>
      <p>You'll see short statistical analyses of real research datasets — mortgage lending,
      online discussion, labour economics, materials science, astronomy. Each shows a
      <strong>research question</strong>, a set of <strong>candidate explanations</strong>,
      and the <strong>statistical result</strong> that was obtained.</p>
      <p>Your job is to decide which explanation the result actually supports — and to flag
      when it supports none of them, when the analysis could not have told them apart, or
      when an obvious explanation is missing from the list.</p>
      <p class="lead">The study moves forward one screen at a time and you cannot go back.
      Selecting Begin indicates your consent to take part.</p>`, [], 'Begin');
  }
  function renderScreener(s){
    const n=`scr_${s.idx}`;
    frame(`<p class="eyebrow">Entry check · ${s.idx+1} of ${S.screener.length}</p>`+
      radioGroup(n, s.q.text, s.q.choices), [n]);
  }
  function renderScreenedOut(){
    prog.style.width='100%'; ticker.textContent='';
    app.innerHTML=`<p class="eyebrow">Thank you</p><h1>You're all set</h1>
      <p class="lead">Based on the entry check, this study isn't a match. We appreciate your time.</p>`+
      (CFG.screened_out_url?`<div class="dl"><button class="go" id="so">Return to Prolific</button></div>`:'');
    if(CFG.screened_out_url) app.querySelector('#so').addEventListener('click',()=>location.href=CFG.screened_out_url);
  }

  function renderPrimer(){
    frame(`<p class="eyebrow">Before you begin · a 30-second guide</p>
      <h1>How to read two of the questions</h1>
      <p>Most of the task is straightforward, but two of the questions are worth a quick word
      so your answers mean the same thing to us as they do to you.</p>
      <div class="panel">
        <section><div class="lbl">“Are these a well-formed set of explanations?”</div>
        <p style="margin:6px 0 13px">A set is <strong>well-formed</strong> when the options are distinct
        and together cover the plausible answers. For <em>“How does X relate to Y?”</em>:</p>
        <ul class="cells">
          <li><span class="k">✓</span><span><strong>Well-formed</strong> — “X positively associated with Y” · “X not associated with Y” · “X negatively associated with Y”: distinct, and they cover the possibilities.</span></li>
          <li><span class="k">✗</span><span><strong>An explanation is missing</strong> — only “positively associated” and “not associated” are listed; the negative case is absent.</span></li>
          <li><span class="k">✗</span><span><strong>Two could both be true</strong> — “positively associated” and “associated” appear together; one is a special case of the other, so both can hold at once.</span></li>
        </ul>
        <p class="lead" style="margin:13px 0 0">Judge each set on its own terms: mark it well-formed when the
        options are distinct and capture the scientifically plausible answers, and flag it as missing when a
        real explanation a researcher would want considered is absent — whether an obvious case like the one
        above or an important scientific alternative — or as overlapping when two options could both hold at once.</p>
        </section>
        <section><div class="lbl">“Is this analysis an appropriate way to test the question?”</div>
        <p style="margin:6px 0 0"><strong>Yes</strong> if the variables and the statistical test are a sensible
        way to address the question; <strong>no</strong> if the analysis uses the wrong variables or the wrong
        kind of test — for example, measuring something other than what the question actually asks about. You are
        not being asked to recompute anything, only to judge whether the analysis fits the question.</p>
        </section>
      </div>`, [], 'I understand — begin');
  }

  function renderTrial(s){
    const t=s.t, id=t.card_id;
    const shown = s.perm.map(i=>t.cells[i]);
    const letters = shown.map((_,i)=>LETTER(i));
    const cellsHtml = shown.map((c,i)=>`<li><span class="k">${LETTER(i)}</span><span>${esc(c)}</span></li>`).join('');
    const q1opts = shown.concat(S.q1_tail);

    const varsHtml = t.variables
      ? `<section><div class="lbl">Variables</div><div class="txt" style="font-size:17px">${esc(t.variables)}</div></section>` : '';
    frame(`<p class="eyebrow">${esc(t.domain_label)}${t.dataset_desc?' · '+esc(t.dataset_desc):''}</p>
      <div class="panel">
        <section><div class="lbl">Research question</div><div class="txt q-serif">${esc(t.question)}</div></section>
        ${varsHtml}
        <section><div class="lbl">Candidate explanations</div><ul class="cells">${cellsHtml}</ul></section>
        <section><div class="lbl">Statistical result</div><div class="stat">${esc(t.evidence)}</div></section>
      </div>`+
      radioGroup(`${id}__q1`, 'Which explanation is most consistent with this result?', q1opts, letters)+
      `<div class="grp">`+
        radioGroup(`${id}__qset`, 'Are these a well-formed and complete set of explanations for this question?', S.q_set)
          .replace('<div class="grp">','<div>')+
        `<div class="followup" data-showon="1"><input id="setwhy_${id}" type="text" placeholder="Optional: what is missing?"></div>`+
      `</div>`+
      radioGroup(`${id}__qval`, 'Based only on what is shown here, how would you describe this result?', S.q_value)+
      radioGroup(`${id}__qanalysis`, 'Is this analysis an appropriate way to test the question?', S.q_analysis),
      [`${id}__q1`,`${id}__qset`,`${id}__qval`,`${id}__qanalysis`]);
  }

  function renderEnd(){
    prog.style.width='100%'; ticker.textContent=`${st.qTotal} / ${st.qTotal}`;
    const payload={meta:{title:S.title, started:st.started, finished:new Date().toISOString(),
      screener_correct:st.screenPass, n_responses:st.resp.length, block:blockIdx, ...PID}, responses:st.resp};
    const hosted = !!(CFG.datapipe_id && CFG.data_url);
    const done   = !!CFG.completion_url;

    app.innerHTML=`<p class="eyebrow">Complete</p><h1>Thank you — that's everything</h1>
      <p class="lead">Your responses have been recorded.</p>
      <p class="note" id="sink"></p><div class="dl" id="acts"></div>`;
    const acts=app.querySelector('#acts'), sink=app.querySelector('#sink');

    const dl=(name,text,type)=>{const b=new Blob([text],{type});const u=URL.createObjectURL(b);
      const a=document.createElement('a');a.href=u;a.download=name;a.click();URL.revokeObjectURL(u);};
    function offerDownload(cls){
      const b=document.createElement('button'); b.className=cls; b.id='dljson';
      b.textContent='Download your responses';
      b.addEventListener('click',()=>dl('responses.json',JSON.stringify(payload,null,2),'application/json'));
      acts.appendChild(b);
    }
    function offerFinish(cls){
      const b=document.createElement('button'); b.className=cls; b.textContent='Finish';
      b.addEventListener('click',()=>location.href=CFG.completion_url);
      acts.appendChild(b);
    }

    if(hosted){
      sink.textContent='Saving…';
      const body=JSON.stringify({experimentID:CFG.datapipe_id,
        filename:(PID.prolific_pid||'anon')+'_'+Date.now()+'.json',
        data:JSON.stringify(payload)});
      fetch(CFG.data_url,{method:'POST',headers:{'Content-Type':'application/json'},body})
        .then(r=>r.json())
        .then(j=>{
          if(j&&j.message==='Success'){ sink.textContent=''; if(done) offerFinish('go'); }
          else throw new Error('save failed');
        })
        .catch(()=>{
          sink.textContent='We could not save your responses automatically. Please download '+
            'the file below and send it to the researcher, then continue.';
          offerDownload('go');
          if(done) offerFinish('ghost');
        });
    } else {
      offerDownload('go');
    }
  }

  function render(){
    const s=st.flow[st.i];
    ({intro:renderIntro, screener:()=>renderScreener(s), primer:renderPrimer, trial:()=>renderTrial(s), end:renderEnd}[s.type])();
    window.scrollTo(0,0);
  }
  buildFlow(); render();
})();
</script>
