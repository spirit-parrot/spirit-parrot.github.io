<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Data-analysis review</title>
</head>
<body>
<style>
  :root{
    --paper:#f6f4f0; --surface:#ffffff; --sunk:#f0eee9;
    --ink:#14181e; --ink-2:#3d4652; --muted:#6b7480; --line:#e2ddd5; --line-2:#cfc8bd;
    --accent:#0d6a62; --accent-ink:#ffffff; --accent-tint:#e2efec; --accent-2:#0a5049;
    --warn:#8a5a12; --maxw:680px;
    --serif:ui-serif,"Iowan Old Style","Charter","Palatino Linotype",Georgia,serif;
    --sans:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  }
  @media (prefers-color-scheme:dark){:root{
    --paper:#0f1317; --surface:#171d22; --sunk:#1e252b; --ink:#eaeef1; --ink-2:#c2cad3;
    --muted:#939daa; --line:#2a333b; --line-2:#3c4752; --accent:#4fb3a6;
    --accent-ink:#08120f; --accent-tint:#152a28; --accent-2:#6cc9bc; --warn:#d9ad5e;
  }}
  :root[data-theme="dark"]{
    --paper:#0f1317; --surface:#171d22; --sunk:#1e252b; --ink:#eaeef1; --ink-2:#c2cad3;
    --muted:#939daa; --line:#2a333b; --line-2:#3c4752; --accent:#4fb3a6;
    --accent-ink:#08120f; --accent-tint:#152a28; --accent-2:#6cc9bc; --warn:#d9ad5e;
  }
  :root[data-theme="light"]{
    --paper:#f6f4f0; --surface:#ffffff; --sunk:#f0eee9; --ink:#14181e; --ink-2:#3d4652;
    --muted:#6b7480; --line:#e2ddd5; --line-2:#cfc8bd; --accent:#0d6a62;
    --accent-ink:#ffffff; --accent-tint:#e2efec; --accent-2:#0a5049; --warn:#8a5a12;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
    font-size:18px;line-height:1.62;-webkit-font-smoothing:antialiased}
  .top{position:fixed;top:0;left:0;right:0;background:var(--paper);z-index:20;border-bottom:1px solid var(--line)}
  .top-in{max-width:var(--maxw);margin:0 auto;padding:13px 24px;display:flex;
    justify-content:space-between;align-items:baseline;gap:16px}
  .brand{font-family:var(--mono);font-size:12px;letter-spacing:.13em;text-transform:uppercase;
    color:var(--muted);font-weight:600}
  .ticker{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--muted)}
  .bar{height:2px;background:var(--line)}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .35s cubic-bezier(.4,0,.2,1)}
  @media (prefers-reduced-motion:reduce){.bar>i{transition:none}}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:96px 24px 72px}
  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.13em;text-transform:uppercase;
    color:var(--accent);font-weight:600;margin:0 0 18px}
  h1{font-family:var(--serif);font-size:36px;line-height:1.14;font-weight:600;margin:0 0 18px;
    letter-spacing:-.014em;text-wrap:balance}
  p{margin:0 0 17px;color:var(--ink-2)}
  p strong{color:var(--ink)}
  .lead{font-size:17px;color:var(--muted)}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:4px;
    padding:26px 28px;margin:0 0 32px;box-shadow:0 1px 2px rgba(20,24,30,.04)}
  .panel section + section{border-top:1px solid var(--line);margin-top:20px;padding-top:20px}
  .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.15em;text-transform:uppercase;
    color:var(--muted);font-weight:600;margin:0 0 9px}
  .txt{margin:0;font-size:18.5px;line-height:1.55;color:var(--ink)}
  .txt.q-serif{font-family:var(--serif);font-size:22px;line-height:1.36;letter-spacing:-.006em}
  .stat{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:15.5px;line-height:1.55;
    background:var(--sunk);border-radius:3px;padding:13px 15px;color:var(--ink);white-space:pre-wrap}
  .cells{list-style:none;padding:0;margin:0}
  .cells li{padding:12px 0;border-top:1px dotted var(--line-2);display:flex;gap:14px;
    font-size:17.5px;line-height:1.5;color:var(--ink)}
  .cells li:first-child{border-top:0;padding-top:0}
  .cells .k{font-family:var(--mono);font-size:14px;color:var(--accent);font-weight:700;padding-top:3px}
  .q{font-family:var(--serif);font-size:20.5px;font-weight:600;line-height:1.36;
    margin:0 0 14px;letter-spacing:-.006em;text-wrap:balance}
  .grp{margin:0 0 32px}
  .opts{display:flex;flex-direction:column;gap:9px}
  .opt{display:flex;align-items:flex-start;gap:14px;border:1px solid var(--line);border-radius:4px;
    padding:14px 17px;cursor:pointer;background:var(--surface);font-size:17.5px;line-height:1.45;
    color:var(--ink);transition:border-color .13s,background .13s}
  .opt:hover{border-color:var(--line-2);background:var(--sunk)}
  .opt.sel{border-color:var(--accent);background:var(--accent-tint);box-shadow:inset 0 0 0 1px var(--accent)}
  .opt input{margin:2px 0 0;accent-color:var(--accent);width:18px;height:18px;flex:0 0 auto}
  .opt .kk{font-family:var(--mono);font-size:14px;color:var(--accent);font-weight:700;flex:0 0 auto}
  .followup{margin-top:11px;display:none}
  .followup.on{display:block}
  .followup input{width:100%;font:inherit;font-size:16.5px;padding:12px 14px;border-radius:4px;
    border:1px solid var(--line-2);background:var(--surface);color:var(--ink)}
  .foot{display:flex;justify-content:flex-end;margin-top:34px;border-top:1px solid var(--line);padding-top:22px}
  button.go{font:inherit;font-size:17px;font-weight:600;background:var(--accent);color:var(--accent-ink);
    border:0;border-radius:4px;padding:14px 34px;cursor:pointer;transition:background .13s}
  button.go:hover:not(:disabled){background:var(--accent-2)}
  button.go:disabled{opacity:.38;cursor:not-allowed}
  button.ghost{font:inherit;font-size:16.5px;background:none;border:1px solid var(--line-2);
    color:var(--ink);border-radius:4px;padding:14px 24px;cursor:pointer}
  .warnmsg{color:var(--warn);font-size:14.5px;margin:12px 0 0;min-height:20px;text-align:right}
  .dl{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
  code{font-family:var(--mono);font-size:.88em;background:var(--sunk);padding:2px 6px;border-radius:3px}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media (max-width:520px){.wrap{padding:92px 18px 56px} h1{font-size:29px}
    .panel{padding:20px 18px} .txt.q-serif{font-size:20px} .q{font-size:19px}}
</style>

<header class="top">
  <div class="top-in"><span class="brand">Data-analysis review</span>
  <span class="ticker" id="ticker"></span></div>
  <div class="bar"><i id="prog"></i></div>
</header>
<div class="wrap"><div id="app"></div></div>

<script>
window.SURVEY = {"title": "Contrastive Discovery — Human Study (pilot)", "screener": [{"text": "A study reports p = 0.03. Which statement is correct?", "choices": ["There is a 3% chance that the null hypothesis is true here", "There is a 3% chance this result was produced by chance", "Results this extreme occur 3% of the time when the null is true", "The effect is large enough to be practically important"], "correct": 2}, {"text": "Proposed answers to “How does X relate to Y?” — (A) X and Y are positively correlated. (B) X and Y are correlated. (C) X and Y are uncorrelated. Can any two of these be true at the same time?", "choices": ["No — they are mutually exclusive", "Yes — (A) and (B)", "Yes — (B) and (C)", "Yes — (A) and (C)"], "correct": 1}, {"text": "A researcher tests 40 independent hypotheses, each at the 5% significance level, and finds 2 significant results. Which statement is correct?", "choices": ["This is about how many significant results chance alone would give", "The two significant results are unlikely to have arisen by chance", "The study lacks the statistical power to detect any real effect", "Testing more hypotheses lowers the chance of a false positive"], "correct": 0}], "trials": [{"card_id": "T67", "domain_label": "Labor economics / sociology", "dataset_desc": "12,686 respondents from a U.S. longitudinal survey (NLSY79).", "question": "How is a respondent's weekly study time related to their exam score?", "cells": ["More study time is associated with higher exam scores", "Study time is not associated with exam scores"], "evidence": "OLS regression predicting exam_score from study_hours: coefficient = +1.42, 95% CI [0.61, 2.23], n = 812.", "variables": "study_hours — self-reported hours of study per week. exam_score — final exam score, 0-100."}, {"card_id": "T68", "domain_label": "Finance / lending", "dataset_desc": "2,380 U.S. mortgage applications with applicant and loan attributes.", "question": "Among applicants with a co-signer, how is loan size related to approval?", "cells": ["Larger loans are associated with lower approval among co-signed applications", "Larger loans are associated with lower approval among all applications", "Loan size is not associated with approval"], "evidence": "Logistic regression predicting approved from loan_amount, restricted to co-signed applications: coefficient = -0.22, 95% CI [-0.38, -0.06], n = 641.", "variables": "loan_amount — requested loan in US dollars. approved — 1 if the application was approved, 0 otherwise. cosigner — 1 if a co-signer was listed."}, {"card_id": "T61", "domain_label": "Materials science", "dataset_desc": "68,805 inorganic crystalline compounds with computed physical properties.", "question": "Does the association between magnetic ordering and band_gap differ between materials with theoretical = True and materials with theoretical = False?", "cells": ["Magnetic ordering is associated with band_gap only among materials with theoretical = False.", "Magnetic ordering is associated with band_gap only among materials with theoretical = True.", "Magnetic ordering is associated with band_gap among both theoretical = False and theoretical = True materials.", "Magnetic ordering is associated with band_gap in neither group."], "evidence": "Correlation between volume and efermi -- Correlation Coefficient: -0.2382392541284045, P-value: 0.0. No confidence interval or n reported in the excerpt.", "variables": "band_gap = \"DFT-computed electronic band gap in eV (0 for metals); note GGA functionals underestimate true gaps\"; ordering = \"Magnetic ordering: 'NM' (non-magnetic), 'FM' (ferromagnetic), 'AFM' (antiferromagnetic), 'FiM' (ferrimagnetic), or 'Unknown'\"; theoretical = \"Boolean: True if the material is a hypothetical / not-yet-synthesized structure (as opposed to experimentally observed in ICSD)\"."}, {"card_id": "T24", "domain_label": "Labor economics / sociology", "dataset_desc": "12,686 respondents from a U.S. longitudinal survey (NLSY79).", "question": "Does family net wealth in 1996 differ between respondents who were convicted of an illegal act in adult court before 1980 and those who were not, and in which direction?", "cells": ["Conviction before 1980 is associated with higher family net wealth in 1996.", "Conviction before 1980 is associated with lower family net wealth in 1996.", "Conviction before 1980 is not associated with family net wealth in 1996."], "evidence": "Two-sample t-test of family net wealth in 1996 by pre-1980 conviction status: T-test statistics: 0.9990600851316653, P-value: 0.31850010836538617. No CI or n reported.", "variables": "'Ever convicted of an illegal act in adult court before 1980': 'Boolean variable that indicates if the respondent was convicted of an illegal act in adult court other than minor traffic violations before 1980' (1 if convicted, 0 if not; 374 respondents in each group); 'Family net wealth, 1996': 'Total Net Wealth for Family. Created by summing all asset values and subtracting all debts for the year 1996' (US dollars; values may be negative)."}, {"card_id": "T57", "domain_label": "Astronomy", "dataset_desc": "50,000 SDSS galaxies with photometric and spectroscopic measurements.", "question": "Does petroR50_r predict extinction_u, and if so with what sign?", "cells": ["Positive effect of petroR50_r on extinction_u", "No effect of petroR50_r on extinction_u", "Negative effect of petroR50_r on extinction_u"], "evidence": "Linear fit of extinction_u on petroR50_r: Pearson correlation coefficient: -0.005, p-value: 0.232; Slope: -0.000, 95% Confidence Interval for the Slope: (-0.001, 0.000) (n not reported in the excerpt).", "variables": "petroR50_r = r-band radius enclosing 50% of the Petrosian flux in arcsec (half-light radius; -9999 is an SDSS no-data sentinel); extinction_u = Galactic dust extinction in the u band in magnitudes (SFD98 dust maps); 50,000 unique galaxies."}, {"card_id": "T58", "domain_label": "Software engineering", "dataset_desc": "276 survey respondents on requirements-engineering practices.", "question": "Does the proportion of respondents reporting Python differ between Solution Architect and Developer roles?", "cells": ["Python is reported more often in Solution Architect roles", "Python is reported more often in Developer roles", "No significant role-based difference in Python usage"], "evidence": "Two-sample t-test of the Python indicator by role: Python usage among Solution Architects: 0.83, Python usage among Developers: 0.74, T-statistic: -1.0761, p-value: 0.2849 (n not reported in the excerpt).", "variables": "D13_ML_Programming_Language_Python = per-respondent indicator of whether Python was among the languages used in their ML-enabled system projects (raw values 'quoted' / 'not quoted', analysed as 1/0); D4_Role = respondent's current role, here restricted to the Solution Architect and Developer categories."}, {"card_id": "T48", "domain_label": "Online discourse", "dataset_desc": "7,975 contributions to online debate threads.", "question": "What is the form of the relationship between an author's H-index and their number of contributions?", "cells": ["Linear positive relationship between H-index and contributions", "Linear negative relationship between H-index and contributions", "Nonlinear or no relationship between H-index and contributions"], "evidence": "OLS with the contribution count as dependent variable and H-index as predictor: x1 coef -0.3051, t -3.072, P>|t| 0.002, [0.025 0.975] -0.500 to -0.110, R-squared 0.006, No. Observations: 1678; no nonlinear model appears in the excerpt.", "variables": "H_Index = author h-index (values 4-136); contributions = an author contribution count (the excerpt labels the outcome y and the predictor x1 and does not name the exact column; this dataset supplies column names and ranges but no field-level descriptions)."}, {"card_id": "T41", "domain_label": "Astronomy", "dataset_desc": "50,000 SDSS galaxies with photometric and spectroscopic measurements.", "question": "Is redshift correlated positively, negatively, or not at all with petroRad_r?", "cells": ["Positive relationship between redshift and Petrosian radius.", "No relationship between redshift and Petrosian radius.", "Negative relationship between redshift and Petrosian radius."], "evidence": "Spearman rank correlation between redshift and Petrosian radius -- Spearman correlation: -0.3169, 95% Confidence Interval: [-0.3252, -0.3090]. No p-value or n reported in the excerpt.", "variables": "redshift = \"Spectroscopic redshift z measured from galaxy emission/absorption lines (range restricted to 0.02-0.3 in this sample)\"; petroRad_r = \"Petrosian radius in the r band (arcsec); measures galaxy angular size\". Sample: 50,000 SDSS DR19 galaxies, one row per galaxy."}, {"card_id": "T49", "domain_label": "Labor economics / sociology", "dataset_desc": "12,686 respondents from a U.S. longitudinal survey (NLSY79).", "question": "Does the variance of 1981 ASVAB subtest scores differ between male and female respondents, and is any difference consistent across subtests?", "cells": ["ASVAB scores show higher variance in males across all test areas", "ASVAB scores show higher variance in females across all test areas", "There is no consistent gender-based difference in variance of ASVAB scores"], "evidence": "Variance comparison by sex, per subtest: Arithmetic Reasoning Male Variance: 10988.289, Female Variance: 8847.556, p-value: 0.000; Word Knowledge Male Variance: 10967.956, Female Variance: 9855.596, p-value: 0.054; Paragraph Comprehension Male Variance: 10469.620, Female Variance: 9677.874, p-value: 0.000.", "variables": "Sex of respondent, 1979 (1 = MALE, 2 = FEMALE); ASVAB Arithmetic Reasoning / Word Knowledge / Paragraph Comprehension Z Score (rounded), 1981 = standardized subtest scores stored as rounded integers (e.g. Word Knowledge runs 168-825 in the file)."}, {"card_id": "T33", "domain_label": "Finance / lending", "dataset_desc": "2,380 U.S. mortgage applications with applicant and loan attributes.", "question": "Do accepted and denied mortgage applications differ in their values of mortgage_credit, and which group has the higher values?", "cells": ["Accepted applications have higher values of mortgage_credit than denied applications.", "Denied applications have higher values of mortgage_credit than accepted applications.", "Values of mortgage_credit do not differ between accepted and denied applications."], "evidence": "Mann-Whitney U test and t-test comparing mortgage_credit between accepted and denied applications: Mann-Whitney U Statistic: 250913.0, p-value: 1.1562170799980968e-07; t-test Statistic: -5.470253614933339, p-value: 8.299260676592929e-08. No CI or n reported in the excerpt.", "variables": "mortgage_credit: 'Applicant's mortgage credit score', an integer from 1 to 4 — the documentation does not state which end of the 1-4 scale corresponds to a better credit rating; deny: '1 if mortgage application was denied, 0 if accepted' (n = 2,380 rows in the dataset)."}, {"card_id": "T28", "domain_label": "Labor economics / sociology", "dataset_desc": "12,686 respondents from a U.S. longitudinal survey (NLSY79).", "question": "Is rank in class in 1981 positively or negatively correlated with the ASVAB Arithmetic Reasoning Z score in 1981?", "cells": ["Rank in class is positively associated with the Arithmetic Reasoning Z score in 1981.", "Rank in class is negatively associated with the Arithmetic Reasoning Z score in 1981.", "There is no association between rank in class and the Arithmetic Reasoning Z score in 1981."], "evidence": "Correlation between rank in class (1981) and ASVAB Arithmetic Reasoning Z score (1981): Correlation Coefficient: -0.31, p-value: 0.0000, 95% Confidence Interval: (-0.33510105276474517, -0.28084566956735285). n not reported.", "variables": "'Rank in class last year attended at this school, 1981': 'Respondent's rank in the class that he attended in school last year (in 1980) (variable recorded in 1981)', numeric with recorded values 1 to 1053 — the documentation does not state whether 1 denotes the top or the bottom of the class; 'ASVAB - Arithmetic Reasoning Z Score (rounded), 1981': 'standardized scores of respondents on the Arithmetic Reasoning section of the ASVAB test' (recorded values 165 to 825)."}, {"card_id": "T02", "domain_label": "Astronomy", "dataset_desc": "50,000 SDSS galaxies with photometric and spectroscopic measurements.", "question": "Does a galaxy's spectroscopic sub-class change the relationship between modelMag_z and redshift?", "cells": ["The relationship between modelMag_z and redshift is mediated by the 'AGN' sub-class.", "The relationship between modelMag_z and redshift is mediated by the 'STARFORMING' sub-class.", "Galaxy sub-class does not mediate the relationship between modelMag_z and redshift."], "evidence": "OLS regression predicting redshift from modelMag_z plus sub-class terms -- modelMag_z coef = 9.008e-07, std err = 3.9e-06, t = 0.231, P>|t| = 0.817; model R-squared = 0.020, F-statistic = 191.8, Prob (F-statistic) = 3.53e-83, No. Observations = 18934. The 95% CI column is cut off in the excerpt (\"-6.\" only).", "variables": "redshift = \"Spectroscopic redshift z measured from galaxy emission/absorption lines (range restricted to 0.02-0.3 in this sample)\"; modelMag_z = \"Model magnitude in the z band (IR, ~905 nm); -9999 is a SDSS 'no-data' sentinel\"; subClass = \"Finer spectroscopic sub-classification (e.g. STARFORMING, STARBURST, AGN, BROADLINE, AGN BROADLINE); NaN when the pipeline could not assign a sub-class\" (NaN for ~62% of rows)."}, {"card_id": "T01", "domain_label": "Materials science", "dataset_desc": "68,805 inorganic crystalline compounds with computed physical properties.", "question": "Which is more strongly associated with a material being stable, bulk_modulus_vrh or shear_modulus_vrh?", "cells": ["Stability is more strongly associated with bulk_modulus_vrh than with shear_modulus_vrh.", "Stability is more strongly associated with shear_modulus_vrh than with bulk_modulus_vrh.", "Neither bulk_modulus_vrh nor shear_modulus_vrh is meaningfully associated with stability."], "evidence": "Regression predicting stability from standardized bulk and shear modulus -- standardized coefficients: bulk_modulus_vrh 0.010819, shear_modulus_vrh 0.014001. The excerpt reports no standard errors, p-values, 95% CI, or n.", "variables": "is_stable = \"True if the material lies exactly on the convex hull (ground state at its composition)\"; bulk_modulus_vrh = \"Voigt-Reuss-Hill average bulk modulus K in GPa\"; and shear_modulus_vrh = \"Voigt-Reuss-Hill average shear modulus G in GPa\" -- both moduli are NaN for ~86% of the 68,805 materials because elasticity was not computed for them (9,644 rows have values)."}, {"card_id": "T29", "domain_label": "Finance / lending", "dataset_desc": "2,380 U.S. mortgage applications with applicant and loan attributes.", "question": "Controlling for other applicant characteristics, what is the sign of the effect of being married on mortgage denial?", "cells": ["Being married is associated with a higher probability of mortgage denial, after controlling for other factors.", "Being married is not associated with the probability of mortgage denial, after controlling for other factors.", "Being married is associated with a lower probability of mortgage denial, after controlling for other factors."], "evidence": "Logistic regression predicting deny with married plus covariates: Coefficient for 'married': -0.49722161209876853, confidence interval for 'married': [-0.798800, -0.195643]. n not reported in the excerpt.", "variables": "married: '1 if applicant is married, 0 otherwise'; deny: '1 if mortgage application was denied, 0 if accepted'; the model also adjusts for other applicant and loan characteristics in the dataset, which the excerpt does not list."}, {"card_id": "T52", "domain_label": "Software engineering", "dataset_desc": "276 survey respondents on requirements-engineering practices.", "question": "Is D5_Software_Experience associated with Q9_ML_Elicitation_Observation?", "cells": ["Respondents with more years of software experience report greater use of observation for elicitation", "Years of software experience are not associated with use of observation for elicitation", "Respondents with fewer years of software experience report greater use of observation for elicitation"], "evidence": "Spearman correlation between D5_Software_Experience and Q9_ML_Elicitation_Observation: Spearman Correlation: 0.011, 95% Confidence Interval: [-0.103, 0.130] (bootstrapped).", "variables": "D5_Software_Experience = years of experience developing software-based products (integer years; -99 appears as a missing-data code); Q9_ML_Elicitation_Observation = degree to which observation is used for ML requirements elicitation in the respondent's organisation, stored in the file as 'quoted' / 'not quoted' (-77 missing); the polarity of the 'quoted' coding is not documented."}], "blocks": [["T67", "T68", "T61", "T24", "T57", "T58", "T48", "T41", "T49", "T33", "T28", "T02", "T01", "T29", "T52"]], "deploy": {"datapipe_id": "poclRwwDPzZ4", "data_url": "https://pipe.jspsych.org/api/data/", "condition_url": "https://pipe.jspsych.org/api/condition/", "completion_url": null, "screened_out_url": null}, "q1_tail": ["None of these is supported by the result", "Cannot tell from this result"], "q_set": ["Yes — they are distinct and cover the plausible explanations", "No — a plausible explanation is missing", "No — two or more of them could both be true at once", "No — both of those problems apply"], "q_value": ["Yes — worth reporting", "Yes, but only as a minor descriptive detail", "No — too obvious to be worth stating", "No — the result does not support a claim", "Outside my expertise"]};
(function(){
  const S = window.SURVEY, app = document.getElementById('app');
  const prog = document.getElementById('prog'), ticker = document.getElementById('ticker');

    : Promise.resolve(fallbackIdx());
  const esc = s => String(s==null?'':s).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

  const LETTER = i => String.fromCharCode(65+i);

  function appendTrials(idx){

    myIds = new Set(S.blocks[blockIdx] || S.trials.map(t=>t.card_id));
    const f = st.flow;
    shuffle(S.trials.filter(t=>myIds.has(t.card_id))).forEach(t=>{
      f.push({type:'trial', t, perm: shuffle(t.cells.map((_,i)=>i))});
    });
    f.push({type:'end'});
    st.qTotal = f.filter(s=>s.type==='screener'||s.type==='trial').length;
  }

  function buildFlow(){
    const f = [{type:'intro'}];
    S.screener.forEach((q,idx)=> f.push({type:'screener', q, idx, last: idx===S.screener.length-1}));
    // Cell display order is randomised per trial; `perm` maps display slot -> canonical
    // index so the response can be scored offline against the system's winner.
    st.flow = f;
    st.qTotal = f.length;      // provisional until the block is known
    st.qDone = 0;
  }

  function radioGroup(name, q, choices, letters){
    return `<div class="grp"><div class="q">${esc(q)}</div><div class="opts" data-grp="${name}">`+
      choices.map((c,i)=>`<label class="opt"><input type="radio" name="${name}" value="${i}">`+
        (letters && i<letters.length ? `<span class="kk">${letters[i]}</span>` : '')+
        `<span>${esc(c)}</span></label>`).join('')+`</div></div>`;
  }
  function wireOpts(){
    app.querySelectorAll('.opts').forEach(g=> g.querySelectorAll('.opt').forEach(o=>{
      o.addEventListener('click',()=>{
        g.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
        o.classList.add('sel'); o.querySelector('input').checked=true;
        const fu = g.parentElement.querySelector('.followup');
        if(fu) fu.classList.toggle('on', o.querySelector('input').value === fu.dataset.showon);
        validate();
      });
    }));
  }
  function collect(names){
    const out={}; let ok=true;
    names.forEach(n=>{ const el=app.querySelector(`input[name="${n}"]:checked`);
      if(!el){ok=false;} else out[n]=Number(el.value); });
    return {ok, out};
  }
  let curNames=[];
  function validate(){ const {ok}=collect(curNames); const b=app.querySelector('#go'); if(b) b.disabled=!ok; }

  function frame(inner, names, btn){
    curNames = names||[];
    app.innerHTML = inner + `<div class="foot"><button class="go" id="go" ${names&&names.length?'disabled':''}>${btn||'Continue'}</button></div>`+
      `<div class="warnmsg" id="warn"></div>`;
    wireOpts();
    app.querySelector('#go').addEventListener('click', onContinue);
    prog.style.width = Math.round(100*st.qDone/Math.max(1,st.qTotal))+'%';
    ticker.textContent = names.length ? `${Math.min(st.qDone+1,st.qTotal)} / ${st.qTotal}` : '';
  }

  function onContinue(){
    const s = st.flow[st.i];
    if(curNames.length){
      const {ok,out}=collect(curNames);
      if(!ok){ app.querySelector('#warn').textContent='Answer every question to continue.'; return; }
      record(s, out); st.qDone++;
      if(s.type==='screener'){
        if(out[`scr_${s.idx}`]===s.q.correct) st.screenPass++;
        if(s.last && st.screenPass<2){ renderScreenedOut(); return; }
        if(s.last){                      // gate passed -> now we need the block
          blockPromise.then(idx=>{ appendTrials(idx); st.i++; render(); });
          return;
        }
      }
    }
    st.i++; render();
  }

  function record(s, out){
    const base={ts:new Date().toISOString(), type:s.type};
    if(s.type==='screener'){
      st.resp.push({...base, key:`screener_${s.idx}`, value:out[`scr_${s.idx}`], correct:s.q.correct});
      return;
    }
    const id=s.t.card_id, K=s.t.cells.length, pick=out[`${id}__q1`];
    // Map the chosen display slot back to the canonical cell index.
    const canonical = pick < K ? s.perm[pick] : null;
    const q1kind = pick < K ? 'cell' : (pick===K ? 'none_supported' : 'cannot_tell');
    const setTxt = app.querySelector(`#setwhy_${id}`);
    st.resp.push({...base, card_id:id, q1_display_idx:pick, q1_canonical_idx:canonical,
      q1_kind:q1kind, q_set:out[`${id}__qset`],
      q_set_text:(setTxt && setTxt.value ? setTxt.value.trim() : ''),
      q_value:out[`${id}__qval`], perm:s.perm.join(',')});
  }

  function renderIntro(){
    frame(`<p class="eyebrow">About 20 minutes · begins with 3 screening questions</p>
      <h1>Which explanation does the evidence support?</h1>
      <p>You'll see short statistical analyses of real research datasets — mortgage lending,
      online discussion, labour economics, materials science, astronomy. Each shows a
      <strong>research question</strong>, a set of <strong>candidate explanations</strong>,
      and the <strong>statistical result</strong> that was obtained.</p>
      <p>Your job is to decide which explanation the result actually supports — and to flag
      when it supports none of them, when the analysis could not have told them apart, or
      when an obvious explanation is missing from the list.</p>
      <p class="lead">The study moves forward one screen at a time and you cannot go back.
      Selecting Begin indicates your consent to take part.</p>`, [], 'Begin');
  }
  function renderScreener(s){
    const n=`scr_${s.idx}`;
    frame(`<p class="eyebrow">Entry check · ${s.idx+1} of ${S.screener.length}</p>`+
      radioGroup(n, s.q.text, s.q.choices), [n]);
  }
  function renderScreenedOut(){
    prog.style.width='100%'; ticker.textContent='';
    app.innerHTML=`<p class="eyebrow">Thank you</p><h1>You're all set</h1>
      <p class="lead">Based on the entry check, this study isn't a match. We appreciate your time.</p>`+
      (CFG.screened_out_url?`<div class="dl"><button class="go" id="so">Return to Prolific</button></div>`:'');
    if(CFG.screened_out_url) app.querySelector('#so').addEventListener('click',()=>location.href=CFG.screened_out_url);
  }

  function renderTrial(s){
    const t=s.t, id=t.card_id;
    const shown = s.perm.map(i=>t.cells[i]);
    const letters = shown.map((_,i)=>LETTER(i));
    const cellsHtml = shown.map((c,i)=>`<li><span class="k">${LETTER(i)}</span><span>${esc(c)}</span></li>`).join('');
    const q1opts = shown.concat(S.q1_tail);

    const varsHtml = t.variables
      ? `<section><div class="lbl">Variables</div><div class="txt" style="font-size:17px">${esc(t.variables)}</div></section>` : '';
    frame(`<p class="eyebrow">${esc(t.domain_label)}${t.dataset_desc?' · '+esc(t.dataset_desc):''}</p>
      <div class="panel">
        <section><div class="lbl">Research question</div><div class="txt q-serif">${esc(t.question)}</div></section>
        ${varsHtml}
        <section><div class="lbl">Candidate explanations</div><ul class="cells">${cellsHtml}</ul></section>
        <section><div class="lbl">Statistical result</div><div class="stat">${esc(t.evidence)}</div></section>
      </div>`+
      radioGroup(`${id}__q1`, 'Which explanation is most consistent with this result?', q1opts, letters)+
      `<div class="grp">`+
        radioGroup(`${id}__qset`, 'Are these options a well-formed set of explanations?', S.q_set)
          .replace('<div class="grp">','<div>')+
        `<div class="followup" data-showon="1"><input id="setwhy_${id}" type="text" placeholder="Optional: what is missing?"></div>`+
      `</div>`+
      radioGroup(`${id}__qval`, 'If you were analysing this dataset, would you report this result?', S.q_value),
      [`${id}__q1`,`${id}__qset`,`${id}__qval`]);
  }

  function renderEnd(){
    prog.style.width='100%'; ticker.textContent=`${st.qTotal} / ${st.qTotal}`;
    const payload={meta:{title:S.title, started:st.started, finished:new Date().toISOString(),
      screener_correct:st.screenPass, n_responses:st.resp.length, block:blockIdx, ...PID}, responses:st.resp};
    app.innerHTML=`<p class="eyebrow">Complete</p><h1>Thank you — that's everything</h1>
      <p class="lead">${st.resp.length} responses recorded. Download them below; join to
      <code>master_map.csv</code> on <code>card_id</code> to score against the system's winner.</p>
      <p class="note" id="sink"></p>
      <div class="dl">${CFG.completion_url?'<button class="go" id="done">Finish &amp; return to Prolific</button>':''}
      <button class="${CFG.completion_url?'ghost':'go'}" id="dljson">Download responses (JSON)</button>
      <button class="ghost" id="dlcsv">Download responses (CSV)</button></div>`;
    if(CFG.datapipe_id && CFG.data_url){
      const el=app.querySelector('#sink'); el.textContent='Submitting…';
      const body = CFG.datapipe_id
        // Filenames MUST be unique per OSF project -- a duplicate fails with
        // OSF_FILE_EXISTS, so a retry would silently lose the response. Timestamp it.
        ? JSON.stringify({experimentID:CFG.datapipe_id,
            filename:(PID.prolific_pid||'anon')+'_'+Date.now()+'.json',
            data:JSON.stringify(payload)})
        : JSON.stringify(payload);
      fetch(CFG.data_url,{method:'POST',headers:{'Content-Type':'application/json'},body})
        .then(r=>r.json()).then(j=>{el.textContent = (j && j.message==='Success')?'Responses submitted.':'Submission failed — please download the file and send it to the researcher.';})
        .catch(()=>{el.textContent='Submission failed — please download the file and send it to the researcher.';});
    }
    if(CFG.completion_url) app.querySelector('#done').addEventListener('click',()=>location.href=CFG.completion_url);
    const dl=(name,text,type)=>{const b=new Blob([text],{type});const u=URL.createObjectURL(b);
      const a=document.createElement('a');a.href=u;a.download=name;a.click();URL.revokeObjectURL(u);};
    app.querySelector('#dljson').addEventListener('click',()=>dl('responses.json',JSON.stringify(payload,null,2),'application/json'));
    app.querySelector('#dlcsv').addEventListener('click',()=>{
      const cols=['type','card_id','q1_display_idx','q1_canonical_idx','q1_kind',
        'q_set','q_set_text','q_value','perm','key','value','correct','ts'];
      const rows=[cols.join(',')].concat(st.resp.map(r=>cols.map(c=>JSON.stringify(r[c]==null?'':r[c])).join(',')));
      dl('responses.csv',rows.join('\n'),'text/csv');});
  }

  function render(){
    const s=st.flow[st.i];
    ({intro:renderIntro, screener:()=>renderScreener(s), trial:()=>renderTrial(s), end:renderEnd}[s.type])();
    window.scrollTo(0,0);
  }
  buildFlow(); render();
})();
</script>

</body>
</html>
